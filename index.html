<title>共鳴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0d0f1f; --panel:rgba(21,24,51,.96); --card:rgba(255,255,255,.04); --line:rgba(190,180,255,.16);
  --ink:#ece8f5; --muted:#8e8aa8; --gold:#f2c46d;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ground:#0d0f1f; --panel:rgba(21,24,51,.96); --ink:#ece8f5; --muted:#8e8aa8; }
}
:root[data-theme="dark"]{ --ground:#0d0f1f; --panel:rgba(21,24,51,.96); --ink:#ece8f5; --muted:#8e8aa8; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ground)}
body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov,#ov button,#hud button{touch-action:manipulation}
/* 舊版 iOS（16.2 以前）不支援 color-mix，改用實色邊框 */
.nocm .slot,.nocm .pslot,.nocm .card,.nocm .badge,.nocm #resRow span,.nocm .foe i,.nocm #bossBar{border-color:var(--c,#666)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:10px 12px 8px;display:flex;flex-direction:column}
#hud.hidden{display:none}
.top{display:flex;align-items:center;gap:10px}
.hp{flex:1;max-width:210px;height:16px;border-radius:9px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.hp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#e8365e,#ff7d96);transition:width .12s}
.hp span{position:absolute;inset:0;font-size:10px;line-height:15px;text-align:center;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.clock{margin-left:auto;text-align:right;line-height:1}
#timer{font-family:var(--serif);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(13,15,31,.7);color:var(--ink);font-size:12px;letter-spacing:-2px;cursor:pointer}
#pauseBtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.xp{height:4px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46f0b4,#6cc8ff);transition:width .1s}
.meta{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
#bottom{margin-top:auto}
#burstBtn{position:absolute;right:12px;bottom:38px;width:56px;height:56px;border-radius:50%;padding:0;pointer-events:auto;border:2px solid rgba(242,196,109,.3);background:conic-gradient(rgba(242,196,109,.75) var(--p,0%),rgba(13,15,31,.72) 0);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#burstBtn span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(13,15,31,.92);color:rgba(242,196,109,.55);font:900 18px var(--serif)}
#burstBtn.ready{border-color:#f2c46d;animation:glow 0.9s ease-in-out infinite alternate}
#burstBtn.ready span{color:#f2c46d}
@keyframes glow{from{box-shadow:0 0 6px rgba(242,196,109,.4)}to{box-shadow:0 0 22px rgba(242,196,109,.9)}}
#wxTxt{margin-left:auto;font-weight:800}
.duo{font-size:15px!important;letter-spacing:-1px;display:flex!important;align-items:center;justify-content:center}
.badge.duo{font-size:19px!important}
.badge.rl{border-radius:50% 50% 12px 12px;border-color:#f2c46d}
.badge.pact{border-style:dashed}
#slots{display:flex;gap:6px;justify-content:center}
#resRow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:6px;min-height:0}
#resRow span{font-size:10px;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--c);background:rgba(13,15,31,.66);font-weight:700}
.prog{display:grid;grid-template-columns:4.6em 1fr 4.4em;align-items:center;gap:8px;font-size:12px;margin-top:7px}
.prog .nm{color:var(--c);font-weight:800}
.prog .tr{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--c)}
.prog .st{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .st.ok{color:var(--c);font-weight:700}
.rres{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}
.rres b{color:var(--c)}
.badge.res{border-style:double;border-width:3px}
.badge.pv,.sk .badge.pv{border-radius:50%}
.hp b{position:absolute;left:0;bottom:0;height:4px;width:0;background:#bfeaff;box-shadow:0 0 6px #bfeaff}
#pslots{display:flex;gap:6px;justify-content:center;margin-top:5px}
.pslot{width:30px;height:30px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c,#666) 45%,transparent);background:rgba(13,15,31,.62);display:grid;place-items:center;position:relative;font-family:var(--serif);font-weight:900;font-size:13px;color:var(--c,#555);padding-bottom:4px}
.pslot.empty{border:1px dashed rgba(255,255,255,.12)}
.pslot .pips{bottom:4px;gap:2px}
.pslot .pips b{width:4px;height:2px}
.slot{width:40px;height:42px;border-radius:11px;border:1px solid color-mix(in srgb,var(--c,#666) 40%,transparent);background:rgba(13,15,31,.62);display:grid;place-items:center;position:relative;font-family:var(--serif);font-weight:900;font-size:18px;color:var(--c,#555);padding-bottom:5px}
.slot.empty{border:1px dashed rgba(255,255,255,.14)}
.pips{position:absolute;bottom:5px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.pips b{width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
.pips b.on{background:var(--c)}
.cgrp{margin:14px 0 2px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.slot .pips{gap:2px}.slot .pips b{width:5px}
.slot .pips b.q.on{background:#f2c46d;box-shadow:0 0 4px #f2c46d}
#bossBar{margin-top:8px;padding:6px 9px 7px;border-radius:10px;background:rgba(13,15,31,.74);border:1px solid color-mix(in srgb,var(--c,#fff) 45%,transparent)}
#bossBar.hidden{display:none}
#bossBar .bh{display:flex;align-items:baseline;gap:8px}
#bossBar strong{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--c)}
#bossBar .bt{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink);text-align:right}
#bossBar .bb{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
#bossBar .bb i{display:block;height:100%;width:100%;background:var(--c);transition:width .1s}
.nick{display:flex;align-items:center;gap:10px;margin:14px 0 2px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left}
.nick span{font-size:13px;color:var(--muted);flex:none}
.nick input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:700 16px var(--sans);-webkit-user-select:text;user-select:text}
.nick input::placeholder{color:var(--muted);font-weight:400}
.nick:focus-within{border-color:var(--gold)}
.lb{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line)}
.lb .rk{font-family:var(--serif);font-weight:900;font-size:18px;color:var(--muted);text-align:center}
.lb.top .rk{color:var(--gold)}
.lb .who{min-width:0;font-weight:800;font-size:15px;overflow-wrap:anywhere}
.lb .who small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.lb .tm{font-family:var(--serif);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.lb.me{background:rgba(242,196,109,.08);border-radius:10px}
.lb .you{font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px;font-weight:700}
textarea.code,textarea.imp{display:block;width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:12px ui-monospace,Menlo,Consolas,monospace;padding:10px;resize:vertical;-webkit-user-select:text;user-select:text;word-break:break-all}
textarea.code{height:64px;margin-top:8px}
textarea.imp{height:92px}
.msg{font-size:12px;color:var(--gold);min-height:1.4em;margin:6px 0 0;text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.tab{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:800 15px var(--sans);cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold);background:rgba(242,196,109,.08)}
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode2 .btn{margin-top:10px}
.mode2 .btn small{display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:2px}
.foe{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.foe i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:3px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 25%,transparent)}
.foe b{color:var(--c);font-weight:800;font-size:14px}
.foe span{display:block;font-size:13px;color:#cfcbe0;line-height:1.55;margin-top:1px}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(22px,7vw,34px);pointer-events:none;opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.8)}
#banner.show{animation:bn 1.9s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translateY(8px) scale(.96)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* Overlay */

<script>
(()=>{
'use strict';
const TAU=Math.PI*2, WIN_T=300, MAX_SLOTS=5, MAX_PV=4, CELL=64;
/* 技能 5 級：Lv1 本體／Lv2 數值／Lv3 形狀斷點／Lv4 關係數值（附著、持續、覆蓋）／Lv5 質變（和其他狀態、反應的新關係）。被動維持 3 級 */
const SKMAX=5, PVMAX=3;
const LV=(a,L)=>a[Math.min(L,a.length)-1];
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dd=(ax,ay,bx,by)=>{const x=ax-bx,y=ay-by;return x*x+y*y};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t}return a};
const fmt=t=>{t=Math.max(0,Math.ceil(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const $=id=>document.getElementById(id);
const SERIF='"Noto Serif TC","Songti TC","PMingLiU",serif';

function fuseTouch(e,el){

  // 兩元素：「底」必須還在敵人身上；全畫面每秒最多 4 次，後期不洗版
  if(t>(S.fzr||0)){ S.fzr=t+1; S.fzn=0; } if(S.fzn>=4) return;
  for(const x of FZ_ELS){ if(x===el||!pres(e,x)) continue; const k=[x,el].sort().join('|'); if(!U[k]) continue; const ck=k+'>'+x; if((S.fcd[ck]||0)>t) continue;
    S.fcd[ck]=t+1.5; fireFz(FZ[k][x],e,COL[el]); return; }
}

function query(x,y,r){
  const out=[], m=r+26;
  const c0=Math.floor((x-m)/CELL),c1=Math.floor((x+m)/CELL),r0=Math.floor((y-m)/CELL),r1=Math.floor((y+m)/CELL);
  for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){
    const b=grid.get(gk(cx,cy)); if(!b)continue;
    for(const e of b){ if(e.dead)continue; const rr=r+e.r; if(dd(x,y,e.x,e.y)<=rr*rr) out.push(e); }
  }
  return out;
}
function nearestN(x,y,n,maxR,skip){

  for(const e of S.E){ if(e.dead||e===skip)continue; const d=dd(x,y,e.x,e.y); if(d<=m)arr.push([d,e]); }
  arr.sort((a,b)=>a[0]-b[0]);

}

function applyStatus(e,st,dur,src,dps){
  if(e.dead||(e.res&&e.res===st))return;

  const s=e.st; let rt=null;
  if(st==='wind'||st==='geo'){
    const list=st==='wind'?ANY5:ELE4, r2=st==='wind'?'swirl':'crystal';
    if((e.rc[r2]||0)>S.t) return;
    for(const x of list) if(s[x]>0){ react(r2,e,0,x); return; }
    return;
  }
  if(st==='burn') rt=s.wet>0?'vaporize':s.oil>0?'combust':s.shock>0?'overload':null;
  else if(st==='wet') rt=s.burn>0?'vaporize':s.shock>0?'conduct':s.chill>0?'freeze':null;
  else if(st==='chill') rt=s.wet>0?'freeze':s.shock>0?'superconduct':null;
  else if(st==='shock') rt=s.wet>0?'conduct':s.burn>0?'overload':s.chill>0?'superconduct':null;
  else if(st==='oil') rt=s.burn>0?'combust':null;
  if(rt&&(e.rc[rt]||0)<=S.t){ react(rt,e,0); return; }
  dur*=1+0.25*pvl('echo');

  else s[st]=Math.max(s[st],dur);
}

const AMP_RX={conduct:170,overload:64,superconduct:72,swirl:100};
function react(type,e,casc,el){

  const hp=T.hp*hpMult(S.t)*(1+(ex/200)**1.8)*1.006**Math.max(0,S.t-480)*(T.elite?1:rand(0.9,1.1));
  const e={tp:type,x:at?at.x:p.x+Math.cos(a)*r,y:at?at.y:p.y+Math.sin(a)*r,r:T.r,hp,max:hp,spd:T.spd*0.85*(1+Math.min(S.t,600)/900)*(1+0.2*(S.mu.haste||0))*rand(0.92,1.08),dmg:T.dmg*1.1*(1+Math.min(S.t,600)/400),ai:T.ai||0,
    xp:T.xp,c:T.c,f:T.f,elite:!!T.elite,armor:T.armor||0,aura:T.aura||null,auT:0,split:T.split||0,purge:T.purge||0,pg:(T.purge||0)*rand(0.5,1),
    st:{burn:0,wet:0,chill:0,shock:0,oil:0,frozen:0,vuln:0},bd:0,bs:'ember',kx:0,ky:0,fl:0,bcd:0,rc:{},fb:0,stun:0,sh:0,dead:false};
  if(e.aura) e.st[e.aura]=1;

/* 在指定位置生成（分裂、母巢用），並繼承來源身上的狀態 */
function spawnAt(type,x,y,src){

function spawnElite(k){
  const e=spawnEnemy('elite'); e.af=k;
  if(k==='blaze'){ e.aura='burn'; e.st.burn=1; e.bzT=2; e.plT=1.6; }
  else if(k==='purge'){ e.purge=3.5; e.pg=3.5; }
  else if(k==='crystal'){ e.sh=e.shMax=e.max*0.5; }
  else if(k==='brood'){ e.brT=3; }
  else if(k==='storm'){ e.res='shock'; e.stT=2; }
  else if(k==='frost'){ e.res='chill'; e.stT=2.5; }
  else if(k==='swift'){ e.stT=2; }
  return e;
}
function spawnElites(n){
  const ks=[]; while(ks.length<n) ks.push(...shuffle(Object.keys(AFX))); ks.length=n;
  ks.forEach(spawnElite);
  banner(ks.map(k=>AFX[k].n).join('・')+(n>1?' 菁英':'菁英出現'),'#ff4d6d');
}
function spawnMidBoss(){   // 標準模式 2:30：守門強敵，打倒掉落三選一聖物，遊戲繼續
  const ks=Object.keys(BOSS).filter(k=>k!==S.bossK), k=ks[(Math.random()*ks.length)|0], B=BOSS[k], e=spawnEnemy('boss',null,spawnDist()*0.8);
  e.boss=k; e.mid=1; e.hp=e.max=B.hp*0.35; e.spd=B.spd; e.c=B.c; e.f=B.f; e.at=3; e.plT=1; e.t0=S.t;
  if(k==='magma'){ e.aura='burn'; e.st.burn=1; } if(k==='eye'){ e.purge=3.5; e.pg=3.5; } if(k==='queen'){ e.brT=1; e.dr=1; e.nb=0; }
  S.boss=e; banner('守門強敵：'+B.n+'（擊敗掉落聖物）',B.c); sfx('slam'); S.shake=0.5;
}
function spawnBoss(){
  const k=S.bossK, B=BOSS[k], e=spawnEnemy('boss',null,spawnDist()*0.8);
  e.boss=k; e.hp=e.max=B.hp*(1+0.7*S.bossN); S.bossN++; e.spd=B.spd; e.c=B.c; e.f=B.f; e.at=3; e.plT=1; e.t0=S.t;
  if(k==='magma'){ e.aura='burn'; e.st.burn=1; }
  if(k==='eye'){ e.purge=3.5; e.pg=3.5; }
  if(k==='queen'){ e.brT=1; e.dr=1; e.nb=0; }
  S.boss=e; banner(B.n,B.c); sfx('slam'); S.shake=0.5;
}
function ringSpawn(type,n){ const o=rand(0,TAU); for(let i=0;i<n;i++) spawnEnemy(type,o+i/n*TAU,spawnDist()*0.92); }
const EVENTS=[
  [60,()=>spawnElites(1)],
  [90,()=>spawnElites(1)],

  [100,()=>{ringSpawn('crawler',24);banner('被包圍了','#ff6fb0')}],
  [120,()=>spawnElites(2)],
  [145,()=>{ringSpawn('bubble',16);banner('泡沫潮','#5fbcff')}],

  [222,()=>{ringSpawn('brute',14);banner('巨殼包圍','#ff6fb0')}],

function pickType(t){
  const w=[['crawler',1]];
  if(t>40) w.push(['runner',0.3]);
  if(t>70) w.push(['husk',0.07],['bubble',0.07]);
  if(t>90) w.push(['brute',0.06+t/2500]);
  if(t>110) w.push(['splitter',0.07]);
  if(t>150) w.push(['cleanser',0.035]);
  for(const k of S.unl) w.push([k,k==='shaman'?0.035*(1+2*(S.mu.warded||0)):0.09]);
  let sum=0; for(const x of w) sum+=x[1];
  let r=Math.random()*sum; for(const [k,x] of w){ r-=x; if(r<=0) return k; }
  return 'crawler';
}
function spawn(dt){
  const t=S.t;
  if(S.E.length<300){
    S.sa+=spawnRate(t)*(S.boss&&!S.boss.dead?0.6:1)*1.25**(S.ct.swarm||0)*dt;
    while(S.sa>=1){ S.sa-=1; spawnEnemy(pickType(t)); }
  }
  for(const [et,fn] of EVENTS){ if(!S.ev[et]&&t>=et){ S.ev[et]=1; fn(); } }
  if(!S.boss||S.boss.dead){
    if(!S.warned&&t>=S.nextBoss-10){ S.warned=1; if(S.endless) S.bossK=S.bossQ[S.bossN%S.bossQ.length]; banner('強敵接近：'+BOSS[S.bossK].n,BOSS[S.bossK].c); sfx('warn'); }
    if(t>=S.nextBoss){ spawnBoss(); S.warned=0; S.nextBoss=S.endless?t+150:1e9; }
  }
  if(S.endless&&t>=300+120*S.layer){
    S.layer++; S.pal=(S.layer-1)%LAYERS.length; S.newE=S.layer<=NEWT.length?NEWT[S.layer-1]:null;
    if(S.newE){ S.unl.push(S.newE); ringSpawn(S.newE,10); }
    S.muPick=1; banner('深淵第 '+S.layer+' 層：'+LAYERS[S.pal].n,LAYERS[S.pal].c);
  }
  if(S.mu.swarm){ S.swT-=dt; if(S.swT<=0){ S.swT=Math.max(8,20/S.mu.swarm); ringSpawn('mite',14+4*S.mu.swarm); } }
  // 無盡模式 5:00 之後：每 30 秒輪流來一波菁英或屍潮，越來越多
  if(S.endless&&t>=300){ const ph=Math.floor((t-300)/30);
    if(ph>=S.ph){ S.ph=ph+1;
      if(ph%2===0) spawnElites(Math.min(4,2+Math.floor(ph/4))+(S.mu.elite||0));
      else { const pool=['crawler','runner','bubble','splitter','husk','brute','cleanser',...S.unl], ty=pool[(ph>>1)%pool.length]; ringSpawn(ty,Math.min(44,22+ph*2)); banner(ET[ty].n+'潮','#ff6fb0'); } } }
}

/* ---------- 敵人的攻擊（只會傷害玩家） ---------- */
function addHaz(h){ if(S.H.length<220) S.H.push(h); }
function blast(x,y,r,dmg){
  addHaz({k:'mark',x,y,r,t:0,dur:0.85,dmg,c:'255,122,61',l:0.85});
  later(0.85,()=>{ for(const o of query(x,y,r)) if(!o.dead){ hit(o,8*dMult(),'blast'); if(!o.dead) applyStatus(o,'burn',3,'blast',2*dMult()); } });
}
/* 深淵敵人的行為：回傳 [方向x, 方向y, 速度]，null 代表照常追擊 */
function enemyAI(e,dt,d,ux,uy){
  const p=S.p, sp0=e.spd*(e.st.chill>0?0.55:1)*(e.st.oil>0?0.72:1);
  switch(e.tp){
    case 'charger':
      if(e.cs==='wind'){ e.cw-=dt; if(e.cw<=0){ e.cs='dash'; e.cw=0.55; } return [e.cdx,e.cdy,0]; }
      if(e.cs==='dash'){ e.cw-=dt; if(e.cw<=0){ e.cs=null; e.cT=2.6; } return [e.cdx,e.cdy,430]; }
      e.cT=(e.cT==null?rand(0.5,2):e.cT)-dt;
      if(e.cT<=0&&d<300){ e.cs='wind'; e.cw=0.7; e.cdx=ux; e.cdy=uy; return [ux,uy,0]; }
      return null;
    case 'spitter':
      e.fT=(e.fT==null?rand(1,2.6):e.fT)-dt;
      if(e.fT<=0&&d<430){ e.fT=2.8; addHaz({k:'shot',x:e.x,y:e.y,vx:ux*150,vy:uy*150,r:6,dmg:e.dmg*1.6,c:'255,92,138',l:4}); }
      if(d<190) return [-ux,-uy,sp0*0.9];
      if(d<250) return [ux,uy,0];
      return null;
    case 'shaman':
      e.wT=(e.wT==null?2:e.wT)-dt;
      if(e.wT<=0){ e.wT=3.2; fxRing(e.x,e.y,140,'#7fe7ff',0.4); for(const o of query(e.x,e.y,140)) if(o!==e&&!o.boss&&!(o.sh>0)) o.sh=o.shMax=o.max*0.4; }
      if(d<260) return [-ux,-uy,sp0*0.8];
      return null;
    case 'blinker':
      if(e.bl){ e.bl.t-=dt; if(e.bl.t<=0){ fxRing(e.x,e.y,22,'#b58cff',0.3); e.x=e.bl.x; e.y=e.bl.y; e.bl=null; e.bT=rand(3.5,5); fxRing(e.x,e.y,30,'#b58cff',0.35); } return [ux,uy,0]; }
      e.bT=(e.bT==null?rand(1.5,3.5):e.bT)-dt;
      if(e.bT<=0&&d>150){ const a=rand(0,TAU); e.bl={x:p.x+Math.cos(a)*85,y:p.y+Math.sin(a)*85,t:0.65}; return [ux,uy,0]; }
      return null;
  }
  return null;
}

function bossAI(e,dt){
  const p=S.p; e.at-=dt;
  if(e.boss==='magma'){
    e.plT-=dt; if(e.plT<=0){ e.plT=1.2; addHaz({k:'pool',x:e.x,y:e.y,r:28,l:5,m:5,dmg:8,c:'255,106,42'}); }
    if(e.at<=0){ e.at=5.5;
      addHaz({k:'mark',x:e.x,y:e.y,r:240,t:0,dur:1.0,dmg:0,c:'255,122,61',l:1.0,follow:e});
      for(let i=0;i<3;i++) later(1.0+i*0.35,()=>{ if(e.dead)return; if(i===0){ sfx('slam'); S.shake=Math.max(S.shake,0.25); } addHaz({k:'ring',x:e.x,y:e.y,rad:e.r,max:240,spd:180,w:8,dmg:15,c:'255,122,61',l:3}); });
    }
  } else if(e.boss==='eye'){

      for(let i=0;i<10;i++){ const a=e.ao+i*TAU/10; addHaz({k:'shot',x:e.x,y:e.y,vx:Math.cos(a)*105,vy:Math.sin(a)*105,r:7,dmg:10,c:'230,217,255',l:6}); } }

    if(e.at<=0){ e.at=6;
      for(let i=0;i<4;i++) addHaz({k:'mark',x:p.x+rand(-95,95),y:p.y+rand(-95,95),r:38,t:0,dur:1.3,dmg:16,c:'155,227,107',l:1.3}); }
  }
}
function updHaz(dt){
  const p=S.p;
  for(const h of S.H){
    h.l-=dt;
    if(h.k==='shot'){ h.x+=h.vx*dt; h.y+=h.vy*dt; if(dd(h.x,h.y,p.x,p.y)<(h.r+p.r)**2){ if(p.inv<=0) hurtPlayer(h.dmg); h.l=0; } }
    else if(h.k==='ring'){ h.rad+=h.spd*dt; if(h.rad>=h.max) h.l=0;
      else if(!h.hit&&Math.abs(Math.sqrt(dd(h.x,h.y,p.x,p.y))-h.rad)<h.w+p.r){ h.hit=1; if(p.inv<=0) hurtPlayer(h.dmg); } }
    else if(h.k==='mark'){ h.t+=dt; if(h.follow&&!h.follow.dead){ h.x=h.follow.x; h.y=h.follow.y; }
      if(h.t>=h.dur&&!h.done){ h.done=1; h.l=0; if(h.dmg>0){ fxBoom(h.x,h.y,h.r,`rgb(${h.c})`); if(dd(h.x,h.y,p.x,p.y)<(h.r+p.r)**2&&p.inv<=0) hurtPlayer(h.dmg); } } }
    else if(h.k==='pool'){ if(p.inv<=0&&dd(h.x,h.y,p.x,p.y)<(h.r+p.r*0.4)**2) hurtPlayer(h.dmg); }
  }
  S.H=S.H.filter(h=>h.l>0);
}

/* ---------- 技能 ---------- */
function updSkills(dt){
  const p=S.p;
  S.vq=clamp(1.25-(S.FX.length+S.Z.length*1.5+S.P.length)/650,0.35,1)*(FXL?0.55:1);   // 畫面負載越高，特效越收斂
  if(S.haste>S.t) dt*=1.25; if(S.rl.twin) dt*=1.54;   // 聖物：時之沙漏   // 融合「油刃」
  for(const id of S.order.flatMap(x=>SK[x]&&SK[x].fz?S.sk[x].parts:[x])){   // 融合欄位：裡面的技能照常攻擊
    const s=S.sk[id], L=s.lv;
    if(SK[id].run){ SK[id].run(id,s,L,dt); continue; }
    switch(id){
      case 'ember':
        s.cd-=dt; if(s.cd>0)break;{
          const n=LV([1,2,3],L), ts=nearestN(p.x,p.y,n,380); if(!ts.length){s.cd=0.15;break}
          s.cd=LV([1.2,1.0,0.85],L);
          const dmg=7*dMult(), bd=LV([3,3,5],L)*dMult(), bdur=L>=4?5:3, seed=L>=5?2:0;
          for(let i=0;i<n;i++){
            const tg=ts[i%ts.length], a=Math.atan2(tg.y-p.y,tg.x-p.x)+(i>=ts.length?rand(-.5,.5):0);
            S.P.push({k:'bolt',x:p.x,y:p.y,vx:Math.cos(a)*360,vy:Math.sin(a)*360,tg,l:1.4,dmg,bd,bdur,seed});
          }
        } break;
      case 'surge':
        s.cd-=dt; if(s.cd>0)break;
        s.cd=LV([3.2,2.7,2.2],L);
        S.P.push({k:'wave',t:0,dur:0.45,max:LV([110,140,170],L),rad:0,hs:new Set(),dmg:2*dMult(),l:1,wd:L>=4?6:4,ebb:L>=5});
        break;
      case 'frost':
        if(!p.mv)break;
        s.acc+=dt; if(s.acc<0.11)break; s.acc=0;
        {const l=LV([2.5,3.2,4],L); S.Z.push({k:'frost',x:p.x+rand(-3,3),y:p.y+rand(-3,3),r:LV([18,22,27],L),l,m:l,cd:L>=4?2:1.2,gel:L>=5});}
        break;
      case 'arc':
        s.cd-=dt; if(s.cd>0)break;{
          const cands=query(p.x,p.y,260); if(!cands.length){s.cd=0.15;break}
          s.cd=LV([1.5,1.25,1.0],L);
          const strikes=L>=3?2:1, B=LV([1,2,3,4],L), rr=L>=4?150:110;
          // Lv5 尋隙：優先挑一碰帶電就會反應的目標
          const pk=a=>{ if(L>=5){ const f=a.filter(o=>o.st.wet>0||o.st.burn>0||o.st.chill>0); if(f.length) a=f; } return a.length?a[(Math.random()*a.length)|0]:null; };
          for(let k=0;k<strikes;k++){
            let cur=pk(cands), px=p.x, py=p.y, dmg=7*dMult();
            const hs=new Set();
            for(let c=0;c<=B&&cur;c++){
              fxBolt(px,py,cur.x,cur.y,COL.shock,0.18); hs.add(cur);
              hit(cur,dmg,'arc'); if(!cur.dead) applyStatus(cur,'shock',3,'arc');
              px=cur.x; py=cur.y; dmg*=0.85;
              cur=pk(query(px,py,rr).filter(o=>!hs.has(o)));
            }
          }
        } break;
      case 'oil':
        s.cd-=dt; if(s.cd>0)break;{
          const cands=query(p.x,p.y,300); if(!cands.length){s.cd=0.2;break}
          s.cd=LV([3.5,3.0,3.0],L);
          for(let k=0;k<(L>=3?2:1);k++){
            const t=densest(cands);
            S.P.push({k:'flask',sx:p.x,sy:p.y,tx:t.x+rand(-12,12),ty:t.y+rand(-12,12),t:0,dur:0.5,r:LV([55,70,82],L),l:1,pl:L>=4?7:5,od:L>=4?1.5:0.5});
          }
        } break;
      case 'blades':{
        const n=LV([2,3,4,5],L), R=LV([58,66,74,80],L), dmg=LV([5,6,7],L)*dMult();
        s.ang+=(L>=3?3.9:3.2)*dt; s.pos=[];
        for(let i=0;i<n;i++){
          const a=s.ang+i*TAU/n, bx=p.x+Math.cos(a)*R, by=p.y+Math.sin(a)*R;
          s.pos.push(bx,by,a);

          s.cd=LV([1.4,1.3,1.1,1.0],L);

          for(let i=0;i<n;i++){

            S.P.push({k:'lance',x:p.x,y:p.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,l:1.0,pc:LV([3,5,6,8],L),dmg,hs:new Set(),thru:L>=5});
          }
        } break;
      case 'gale':
        s.cd-=dt; if(s.cd>0)break;{
          const cands=query(p.x,p.y,320); if(!cands.length){s.cd=0.3;break}
          s.cd=LV([3,2.6],L);
          for(let k=0;k<(L>=3?2:1);k++){
            const t=densest(cands), a=Math.atan2(t.y-p.y,t.x-p.x)+(k?rand(-0.7,0.7):0);
            S.P.push({k:'gale',x:p.x,y:p.y,vx:Math.cos(a)*120,vy:Math.sin(a)*120,r:LV([34,42,42,48],L),l:L>=4?3.4:2.6,hs:new Map(),dmg:2*dMult(),bear:L>=5,carry:null});
          }
        } break;
      case 'rock':
        s.cd-=dt; if(s.cd>0)break;{
          const cands=query(p.x,p.y,300); if(!cands.length){s.cd=0.3;break}
          s.cd=LV([2.6,2.3],L);
          for(let k=0;k<(L>=3?2:1);k++){
            const t=densest(cands);
            S.P.push({k:'rock',x:t.x+rand(-12,12),y:t.y+rand(-12,12),t:0,dur:0.45,r:LV([44,52,56,64],L),dmg:LV([5,6,7,8],L)*dMult(),l:1,absorb:L>=5,el:L>=5?s.el:null});
            if(L>=5) s.el=null;
          }
        } break;
      case 'gravity':
        s.cd-=dt; if(s.cd>0)break;{
          const cands=query(p.x,p.y,280); if(!cands.length){s.cd=0.3;break}
          s.cd=LV([5,4.5],L);
          for(let k=0;k<(L>=3?2:1);k++){
            const t=densest(cands), l=LV([2,2.5,2.5,3],L);
            S.Z.push({k:'well',x:t.x,y:t.y,r:LV([140,165,185],L),l,m:l,str:LV([115,130,140,155],L),col:L>=5});
          }
        } break;
    }
  }
}

/* ---------- 投射物、區域 ---------- */
function updProj(dt){
  const p=S.p;
  for(const o of S.P){
    if(o.k==='bolt'){
      if(o.tg&&!o.tg.dead){
        const a=Math.atan2(o.tg.y-o.y,o.tg.x-o.x), cur=Math.atan2(o.vy,o.vx);
        let da=a-cur; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
        const na=cur+clamp(da,-7*dt,7*dt); o.vx=Math.cos(na)*360; o.vy=Math.sin(na)*360;
      }
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.l-=dt;
      const hs=query(o.x,o.y,5);
      if(hs.length){ const e=hs[0]; hit(e,o.dmg,'ember'); if(!e.dead){ applyStatus(e,'burn',o.bdur||3,'ember',o.bd); if(o.seed&&e.st.burn>0&&e.aura!=='burn') e.seed=Math.max(e.seed||0,o.seed); } o.l=0; burst(o.x,o.y,COL.burn,4,80,2); }
      else if(Math.random()<0.5) fx({k:'pt',x:o.x,y:o.y,vx:0,vy:0,c:COL.burn,l:.2,m:.2,s:2.5});
    } else if(o.k==='lance'){
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.l-=dt;
      for(const e of query(o.x,o.y,6)){
        if(o.hs.has(e))continue; o.hs.add(e);
        const wasF=o.thru&&e.st.frozen>0;   // Lv5 穿冰：打碎凍結的敵人不算貫穿
        hit(e,o.dmg,'lance',true); if(!e.dead) applyStatus(e,'chill',2,'lance');
        if(!wasF&&--o.pc<=0){o.l=0;break}
      }
    } else if(o.k==='flask'){
      o.t+=dt;
      if(o.t>=o.dur){ o.l=0; const pl=o.pl||5; S.Z.push({k:'oil',x:o.tx,y:o.ty,r:o.r,l:pl,m:pl,od:o.od||0.5}); burst(o.tx,o.ty,COL.oil,10,140,3); }
    } else if(o.k==='xs'||o.k==='xk'||o.k==='xn'){ updX(o,dt);
    } else if(o.k==='gale'){
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.l-=dt;
      for(const e of query(o.x,o.y,o.r)){
        const w=e.elite?0.25:0.8; e.x+=o.vx*dt*w; e.y+=o.vy*dt*w;
        if((o.hs.get(e)||0)>S.t) continue; o.hs.set(e,S.t+0.8);
        hit(e,o.dmg,'gale'); if(e.dead) continue;
        if(o.bear){   // Lv5 挾帶：記住第一個擴散出去的狀態，之後沿途附加
          if(o.carry&&!(e.st[o.carry]>0)) applyStatus(e,o.carry,3,'gale',2*dMult());
          else if(!o.carry&&(e.rc.swirl||0)<=S.t){ const x=ANY5.find(k=>e.st[k]>0); if(x) o.carry=x; }
          if(e.dead) continue;
        }
        applyStatus(e,'wind',0,'gale');
      }
    } else if(o.k==='rock'){
      o.t+=dt;
      if(o.t>=o.dur){
        o.l=0; fxBoom(o.x,o.y,o.r,COL.geo); burst(o.x,o.y,'#f3d39a',10,160,3); S.shake=Math.max(S.shake,0.08); sfx('rock');
        const rs=S.sk.rock, canAb=o.absorb&&!o.el&&rs;
        for(const e of query(o.x,o.y,o.r)){ hit(e,o.dmg,'rock',true); if(!e.dead){
          // Lv5 元素岩：吸收結晶的元素（落石自己帶出去的元素不算，避免自己餵自己）
          if(canAb&&!o.got&&!(e.rkT>S.t)&&(e.rc.crystal||0)<=S.t){ const x=ELE4.find(k=>e.st[k]>0); if(x) o.got=x; }
          applyStatus(e,'geo',0,'rock');
          if(o.el&&!e.dead){ applyStatus(e,o.el,2.5,'rock',3*dMult()); e.rkT=S.t+2.5*(1+0.25*pvl('echo'))+0.2; }
          if(!e.dead) knock(e,o.x,o.y,70); } }
        if(o.el) fxRing(o.x,o.y,o.r+10,COL[o.el],0.4);
        if(o.got&&rs&&!rs.el) rs.el=o.got;
      }
    } else if(o.k==='wave'){
      o.t+=dt; const k=Math.min(1,o.t/o.dur); o.rad=o.max*(1-(1-k)*(1-k));
      for(const e of query(p.x,p.y,o.rad)){
        if(o.hs.has(e))continue; o.hs.add(e);
        hit(e,o.dmg,'surge'); if(!e.dead){ knock(e,p.x,p.y,110); applyStatus(e,'wet',o.wd||4,'surge'); }
      }
      if(o.ebb&&!o.eb&&o.t>=o.dur+0.12){   // Lv5 退潮：收回到 62% 半徑，把外圈敵人拉回來擠成一圈
        o.eb=1; const R0=o.max*0.62;
        S.P.push({k:'ebb',t:0,dur:0.3,from:o.max,to:R0,rad:o.max,l:1});
        for(const e of query(p.x,p.y,o.max+30)){ const d=Math.sqrt(dd(e.x,e.y,p.x,p.y)); if(d<=R0) continue;
          knock(e,p.x,p.y,-Math.min(420,7*(d-R0))); if(!e.dead) applyStatus(e,'wet',o.wd||4,'surge'); }
      }
      if(o.t>=o.dur+0.15&&(!o.ebb||o.eb))o.l=0;
    } else if(o.k==='ebb'){
      o.t+=dt; const k=Math.min(1,o.t/o.dur); o.rad=o.from+(o.to-o.from)*k*(2-k); if(o.t>=o.dur)o.l=0;
    }
  }
  S.P=S.P.filter(o=>o.l>0);
}
function updZones(dt){
  for(const z of S.Z){
    z.l-=dt;
    if(z.ch>S.t&&(z.cht=(z.cht||0)-dt)<=0){ z.cht=0.5; for(const e of query(z.x,z.y,z.r)) applyStatus(e,'shock',2,'spear'); }   // 雷槍 Lv5 充能
    if(z.k==='xz'){ updXZ(z,dt); continue; }
    if(z.k==='gz'){ for(const e of query(z.x,z.y,z.r)) applyStatus(e,z.el,1.2,z.src||'weather',2*dMult()); continue; }
    if(z.k==='frost'){ for(const e of query(z.x,z.y,z.r)){
        if(z.gel&&e.st.oil>0&&!(e.st.frozen>0)&&(e.rc.freeze||0)<=S.t){ e.st.oil=0; react('freeze',e,0); continue; }   // Lv5 凝油
        applyStatus(e,'chill',z.cd||1.2,'frost'); } }
    else if(z.k==='oil'){ for(const e of query(z.x,z.y,z.r)) applyStatus(e,'oil',z.od||0.5,'oil'); }
    else if(z.k==='well'&&z.col&&z.l<=0&&!z.done){ z.done=1; collapse(z); }
    else if(z.k==='steam'){ for(const e of query(z.x,z.y,z.r)) applyStatus(e,'wet',1.2,'vaporize'); }
    else if(z.k==='scorch'){ const bd=2*rMult(); for(const e of query(z.x,z.y,z.r)) applyStatus(e,'burn',1.5,'combust',bd); }
  }
  S.Z=S.Z.filter(z=>z.l>0);
}

/* 引力核 Lv5 坍縮：井裡的敵人互相交換一種狀態 */
function collapse(z){
  const ts=query(z.x,z.y,z.r*0.7).filter(e=>!e.dead).slice(0,18); if(ts.length<2) return;
  const has=ts.map(e=>ANY5.filter(k=>e.st[k]>0));
  fxRing(z.x,z.y,z.r*0.7,'#b58cff',0.45); fxRing(z.x,z.y,30,'#f2c46d',0.35); sfx('swirl');
  const give=[];
  ts.forEach((e,i)=>{ const pool=[]; has.forEach((h,j)=>{ if(j!==i) for(const k of h) if(!(e.st[k]>0)) pool.push(k); }); if(pool.length) give.push([e,pool[(Math.random()*pool.length)|0]]); });
  later(0.06,()=>{ for(const [e,k] of give) if(!e.dead){ fxBolt(z.x,z.y,e.x,e.y,COL[k],0.15); applyStatus(e,k,3,'gravity',2*dMult()); } });
}

/* ---------- 敵人 ---------- */
function updEnemies(dt){
  const p=S.p, wells=S.Z.filter(z=>z.k==='well'), dec=Math.exp(-7*dt), far=spawnDist()*1.45;
  for(const e of S.E){
    if(e.dead)continue;
    const s=e.st;
    const hold=e.hold>S.t;   // 領域 Lv5 凝滯
    if(s.burn>0){ if((!S.rl.flame||e.aura==='burn')&&!hold) s.burn-=dt; if(e.aura!=='burn') hit(e,e.bd*dt*(S.rl.flame?3:1),e.bs,false,true); if(e.dead)continue;
      if(s.burn<=0&&e.seed>0){ const n=e.seed-1; e.seed=0;   // 餘燼彈 Lv5 火種：自然熄滅就跳到別人身上
        const o=nearestN(e.x,e.y,4,150,e).find(o=>!(o.st.burn>0)&&o.aura!=='burn');
        if(o){ fxBolt(e.x,e.y,o.x,o.y,COL.burn,0.2); applyStatus(o,'burn',5,'ember',e.bd); if(!o.dead&&o.st.burn>0&&n>0) o.seed=n; } } }
    else if(e.seed) e.seed=0;
    if(!hold){ if(s.wet>0)s.wet-=dt; if(s.chill>0)s.chill-=dt; if(s.shock>0)s.shock-=dt; if(s.oil>0)s.oil-=dt; }
    if(s.vuln>0)s.vuln-=dt;
    if(s.frozen>0){ s.frozen-=dt; if(s.frozen<=0&&e.fb){ e.fb=0; frostBurst(e); if(e.dead)continue; } }
    // 天生狀態：被反應消耗後，過一段時間會重新出現（寒冷會拖慢火焰重燃）
    if(e.aura){ const k=e.aura;
      if(s[k]>0){ s[k]=Math.max(s[k],1); e.auT=e.boss?4:2.5; }
      else { e.auT-=dt*(k==='burn'&&s.chill>0?0.3:1); if(e.auT<=0){ s[k]=1; if(k==='burn') e.bd=0; } } }
    if(e.stun>0) e.stun-=dt;
    if(e.purge){ e.pg-=dt; if(e.pg<=0){ e.pg=e.purge; purgeAt(e,e.boss?170:e.elite?130:95); } }
    if(e.brT!=null){ e.brT-=dt; if(e.brT<=0){ e.brT=e.boss?4:5; const n=e.boss?6:4;
      for(let i=0;i<n;i++){ const a=rand(0,TAU); spawnAt('mite',e.x+Math.cos(a)*(e.r+10),e.y+Math.sin(a)*(e.r+10),e); } } }
    if(e.af==='blaze'){
      e.bzT-=dt; if(e.bzT<=0){ e.bzT=2; for(const o of nearestN(e.x,e.y,3,140,e)) if(!o.elite) applyStatus(o,'burn',3,'ember',0); }
      e.plT-=dt; if(e.plT<=0){ e.plT=1.6; addHaz({k:'pool',x:e.x,y:e.y,r:24,l:4,m:4,dmg:7,c:'255,106,42'}); }
    }
    if(e.af==='storm'){ e.stT-=dt; if(e.stT<=0){ e.stT=3.2; for(let i=0;i<3;i++){ const a=rand(0,TAU), d=i?rand(35,85):0; addHaz({k:'mark',x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:34,t:0,dur:1.0,dmg:9,c:'255,224,74',l:9}); } } }
    else if(e.af==='frost'){ e.stT-=dt; if(e.stT<=0){ e.stT=4; for(let i=0;i<6;i++){ const a=i*TAU/6+rand(-0.2,0.2); addHaz({k:'mark',x:e.x+Math.cos(a)*90,y:e.y+Math.sin(a)*90,r:30,t:0,dur:1.1,dmg:8,c:'127,208,255',l:9}); } } }
    else if(e.af==='swift'){ if(e.cs==='wind'){ e.cw-=dt; if(e.cw<=0){ e.cs=null; e.kx=e.cdx*950; e.ky=e.cdy*950; burst(e.x,e.y,'#ff6fb0',10,200,2.5); } }
      else { e.stT-=dt; if(e.stT<=0&&!(s.frozen>0)&&!(e.stun>0)){ e.stT=3.2; const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1; e.cdx=dx/d; e.cdy=dy/d; e.cs='wind'; e.cw=0.7; } } }
    if(e.boss) bossAI(e,dt);
    if(e.bcd>0)e.bcd-=dt; if(e.fl>0)e.fl-=dt;
    let sp=e.spd; if(s.chill>0)sp*=0.55; if(s.oil>0)sp*=0.72; if(s.frozen>0||e.stun>0)sp=0; if(e.slw>S.t)sp*=e.slwF;
    const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
    if(d>far&&!e.boss){ const a=Math.atan2(-dy,-dx)+Math.PI+rand(-1,1), r=spawnDist(); e.x=p.x+Math.cos(a)*r; e.y=p.y+Math.sin(a)*r; continue; }
    if(e.boss&&d>380) sp*=3;
    let ux=dx/d, uy=dy/d;
    if(e.ai&&!(s.frozen>0||e.stun>0)){ const r2=enemyAI(e,dt,d,ux,uy); if(r2){ ux=r2[0]; uy=r2[1]; sp=r2[2]; } }
    let vx=ux*sp, vy=uy*sp;
    for(const w of wells){
      const wx=w.x-e.x, wy=w.y-e.y, wd=Math.hypot(wx,wy);
      if(wd<w.r&&wd>5){ const f=w.str*(e.boss?0.1:e.elite?0.35:1)*(0.55+0.45*(1-wd/w.r)); vx=vx*0.3+wx/wd*f; vy=vy*0.3+wy/wd*f; }
    }
    e.x+=(vx+e.kx)*dt; e.y+=(vy+e.ky)*dt; e.kx*=dec; e.ky*=dec;
    if(e.tp==='bomber'){ const rr=e.r+p.r+14; if(s.frozen<=0&&e.stun<=0&&dd(p.x,p.y,e.x,e.y)<rr*rr){ kill(e,'blast'); continue; } }
    else if(s.frozen<=0&&e.stun<=0&&p.inv<=0){
      const rr=e.r+p.r;
      if(dd(p.x,p.y,e.x,e.y)<rr*rr) hurtPlayer((e.cs==='dash'?e.dmg*1.5:e.dmg)*(e.wk>S.t?0.6:1));
    }
  }
  // 分離
  for(const e of S.E){
    if(e.dead)continue;
    const cx=Math.floor(e.x/CELL), cy=Math.floor(e.y/CELL);
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
      const b=grid.get(gk(cx+i,cy+j)); if(!b)continue;
      for(const o of b){
        if(o===e||o.dead)continue;
        const x=e.x-o.x, y=e.y-o.y, rr=e.r+o.r, q=x*x+y*y;
        if(q<rr*rr&&q>0.01){ const d=Math.sqrt(q), push=(rr-d)*0.5*(o.r/(e.r+o.r)); e.x+=x/d*push; e.y+=y/d*push; }
      }
    }
  }
}
function updQ(dt){
  const list=S.Q; S.Q=[];
  for(const it of list){ it.t-=dt; if(it.t<=0) it.fn(); else S.Q.push(it); }
}
function updGems(dt){
  const p=S.p, pk=pickR(), pr=pk*pk;
  for(const g of S.G){
    if(g.k==='cry'){ g.l-=dt; if(g.l<=0){ g.dead=true; continue; } }
    const dx=p.x-g.x, dy=p.y-g.y, q=dx*dx+dy*dy;
    if(!g.m&&q<pr) g.m=true;
    if(g.m){
      const d=Math.sqrt(q)||1; g.s+=900*dt; const st=Math.min(d,(200+g.s)*dt);
      g.x+=dx/d*st; g.y+=dy/d*st;
      if(d<p.r+8){ g.dead=true; collect(g); }
    } else if(!g.k&&q>4e6) g.dead=true;
  }
  S.G=S.G.filter(g=>!g.dead);
}
function collect(g){
  const p=S.p;
  if(!g.k){ gainXp(g.v); return; }
  if(g.k==='cry'){
    p.sh=Math.min(shMax(),p.sh+8); sfx('shield'); txt(p.x,p.y-p.r-12,'+8 盾','#bfeaff',0.8);
    if(S.res.crystal){ const bd=3*rMult(); fxRing(p.x,p.y,110,COL[g.el],0.4); for(const o of query(p.x,p.y,110)) applyStatus(o,g.el,3,'crystal',bd); }
  } else if(g.k==='food'){ p.hp=Math.min(p.max,p.hp+30); sfx('food'); txt(p.x,p.y-p.r-12,'+30','#ff7d96',0.9); }
  else if(g.k==='mag'){ for(const o of S.G) if(!o.k) o.m=true; sfx('food'); txt(p.x,p.y-p.r-12,'全部吸過來','#46f0b4',0.9); }
  else if(g.k==='chest'){ S.pend++; S.pc++; p.hp=Math.min(p.max,p.hp+20); sfx('chest'); }
}
function gainXp(v){
  const p=S.p; p.xp+=v*xpMul();
  while(p.xp>=p.next){ p.xp-=p.next; p.lv++; p.next=xpNeed(p.lv); S.pend++; p.hp=Math.min(p.max,p.hp+8); }
}
function updFX(dt){
  const k=Math.exp(-5*dt);
  for(const f of S.FX){ f.l-=dt; if(f.k==='pt'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=k; f.vy*=k; } }
  S.FX=S.FX.filter(f=>f.l>0);
  for(const t of S.TX){ t.l-=dt; t.y-=26*dt; }
  S.TX=S.TX.filter(t=>t.l>0);
  if(S.shake>0)S.shake-=dt; if(S.hurt>0)S.hurt-=dt;
}

/* ---------- 玩家 ---------- */
const input={active:false,id:null,ox:0,oy:0,cx:0,cy:0,keys:{}};
function updPlayer(dt){
  const p=S.p; let ix=0,iy=0;
  if(input.active){
    let dx=input.cx-input.ox, dy=input.cy-input.oy; const l=Math.hypot(dx,dy);
    if(l>70){ input.ox=input.cx-dx/l*70; input.oy=input.cy-dy/l*70; dx=input.cx-input.ox; dy=input.cy-input.oy; }
    const L=Math.hypot(dx,dy);
    if(L>6){ const k=Math.min(1,L/48); ix=dx/L*k; iy=dy/L*k; }
  }
  const K=input.keys, kx=(K.right?1:0)-(K.left?1:0), ky=(K.down?1:0)-(K.up?1:0);
  if(kx||ky){ const l=Math.hypot(kx,ky); ix=kx/l; iy=ky/l; }
  const m=Math.hypot(ix,iy); p.mv=m>0.05;
  const sp=p.spd*(1+0.1*pvl('spd'));
  if(p.mv){ p.x+=ix*sp*dt; p.y+=iy*sp*dt; p.fx=ix/m; p.fy=iy/m; p.moved=true; }
  if(p.inv>0)p.inv-=dt;
  const vl=pvl('vit'); if(vl&&p.hp<p.max) p.hp=Math.min(p.max,p.hp+[0,0.4,0.8,1.2][vl]*dt);
  if(p.shT>0) p.shT-=dt;
  else { const wl=pvl('ward'); if(wl&&p.sh<shMax()) p.sh=Math.min(shMax(),p.sh+[0,3,4,5][wl]*dt); }
}

/* ---------- 主更新 ---------- */
function update(dt){
  S.t+=dt;
  updPlayer(dt);
  spawn(dt);
  buildGrid();
  updWeather(dt);
  updSkills(dt);
  updProj(dt);
  updZones(dt);
  updEnemies(dt);
  updHaz(dt);
  updQ(dt);
  updGems(dt);
  updFX(dt);
  S.E=S.E.filter(e=>!e.dead);
  updHUD();
  if(S.bossDown&&S.t-S.bossDown>1.6){ endGame(true); return; }
  if(S.p.hp<=0&&S.rl.phoenix&&!S.phx){ S.phx=1; phoenixRise(); }
  if(S.p.hp<=0){ endGame(false); return; }
  if(!S.endless&&S.t>=WIN_T){ endGame(true); return; }
  if(S.muPick) openMutation(); else if(S.pend>0) openLevelUp();
}

  el.lvTxt.textContent='Lv '+p.lv;
  el.killTxt.textContent=S.kills+' 擊殺';
  const bm=burstMax(), bp=Math.min(100,S.bc/bm*100);
  el.burstBtn.style.setProperty('--p',bp+'%'); el.burstBtn.classList.toggle('ready',S.bc>=bm&&S.bcd<=0);
  if(S.wx){ el.wxTxt.textContent=WX[S.wx].n+' '+Math.ceil(S.wxT)+'s'; el.wxTxt.style.color=WX[S.wx].c; } else el.wxTxt.textContent='';

    el.bossFill.style.width=Math.max(0,b.hp/b.max*100)+'%'; el.bossTip.textContent=bossState(b); }
  else el.bossBar.classList.add('hidden');

function bossState(b){
  if(b.boss==='magma') return b.st.burn>0?'外殼燃燒：傷害 −75%':'外殼冷卻：傷害 +30%';
  if(b.boss==='eye') return '淨化倒數 '+Math.max(0,b.pg).toFixed(1)+' 秒';
  return b.nb?'蟎守護 ×'+b.nb+'：傷害 −'+Math.round((1-b.dr)*100)+'%':'沒有蟎：全額傷害';
}
function renderSlots(){
  let h='';

function starterChoices(){ return shuffle(Object.keys(SK).filter(k=>SK[k].st)).slice(0,3).map(id=>({id})); }
function genChoices(){
  const n=3+(S.rl.echo?1:0), pick=a=>a[(Math.random()*a.length)|0];
  if(S.pc>0){ const rl=shuffle(Object.keys(RL).filter(k=>!S.rl[k])).slice(0,n).map(k=>({rl:k})); if(rl.length>=2) return rl; }
  const fullS=slotsUsed()>=MAX_SLOTS, fullP=S.porder.length>=MAX_PV, sp=[], pp=[];
  const own=[], nw=[];
  for(const id in SK){ const s=S.sk[id]; if(s){ if(s.lv<SKMAX)own.push({id}); } else if(!fullS&&!SK[id].hidden) nw.push({id}); }
  shuffle(own); shuffle(nw);   // 技能池變大後，已擁有技能的升級優先（65%），新技能不會把 Build 稀釋掉
  while(own.length||nw.length) sp.push(own.length&&(!nw.length||Math.random()<0.65)?own.shift():nw.shift());
  for(const id in PV){ const l=S.pv[id]||0; if(l){ if(l<PVMAX)pp.push({pv:id}); } else if(!fullP) pp.push({pv:id}); }
  shuffle(pp);
  const r=Math.random();
  let np=S.p.lv<=6?1:r<0.12?0:r<0.8?1:2; np=Math.min(np,pp.length);
  const specials=[], rp=Object.keys(REACT).filter(k=>(S.rc[k]||0)>=resNeed()&&!S.res[k]), fo=fuseOpts();
  if(fo.length&&Math.random()<0.7) specials.push(pick(fo));
  if(rp.length&&Math.random()<0.65) specials.push({r:pick(rp)});
  let out=specials.slice(0,n-1).concat(pp.slice(0,np),sp,pp.slice(np)).slice(0,n);
  const cts=Object.keys(CT).filter(k=>(S.ct[k]||0)<CT_MAX[k]);
  if(cts.length&&out.length===n&&S.p.lv>=12&&Math.random()<0.15) out[n-1]={ct:pick(cts)};
  // 後期：技能、被動都滿了以後，用聖物、契約、昇華補位，不再只剩補血
  if(out.length<n) out=out.concat(shuffle(Object.keys(RL).filter(k=>!S.rl[k])).slice(0,n-out.length).map(k=>({rl:k})));
  if(out.length<n&&cts.length) out.push({ct:pick(cts)});
  const mk=shuffle(Object.keys(REACT).filter(k=>S.rc[k]>0&&(S.ms[k]||0)<5)).slice(0,2);
  for(const k of mk) if(out.length<n) out.push({ms:k});
  const mine=S.order.filter(id=>!SK[id].hidden), other=Object.keys(SK).filter(id=>!S.sk[id]&&!SK[id].hidden);
  if(out.length<n&&mine.length&&other.length) out.push({tm:[pick(mine),pick(other)]});
  if(out.length<n) out.push({asc:1});
  if(out.length<n&&S.p.hp<S.p.max*0.6) out.push({f:'heal'});
  while(out.length<n) out.push({f:S.p.hp<S.p.max?'heal':'guard'});
  return shuffle(out);
}
function elSet(list){
  const s=new Set(list);

  if(ELE4.some(x=>s.has(x))) s.add('ele');

}

/* 元素融合：兩種元素都有 Lv5 技能時可以解鎖；已解鎖兩組相關融合時，可以解鎖三元素融合 */
function ownedEls(extra){
  const l=[]; for(const id of S.order) l.push(...SK[id].ap); if(extra) l.push(...extra);
  return elSet(l);
}
function rxFor(id){
  const ap=SK[id].ap; if(!ap.length) return [];
  const all=ownedEls(ap), out=[];
  for(const k in REACT){
    const pr=REACT[k].pair, ex=pr.flatMap(x=>EXP[x]?[x,...EXP[x]]:[x]);
    if(!ap.some(a=>ex.includes(a))) continue;
    const on=pr.every(x=>all.has(x));
    // 擴散、結晶能接任何元素；只有真的帶著風／岩時才列出，避免每張卡都塞滿
    if(!on&&pr.some(x=>x==='any'||x==='ele')&&!ap.some(a=>pr.includes(a))) continue;
    out.push({k,on});
  }

}
const chip=(st)=>`<span class="chip" style="--c:${COL[st]}">${STN[st]}</span>`;
function resChain(k){
  const raw=RES[k].out, outs=raw.flatMap(o=>o==='ele'||o==='any'?EXP[o]:[o]), own=ownedEls(), res=[];
  const wild=raw.some(o=>o==='ele'||o==='any');
  for(const rk in REACT){
    const pr=REACT[rk].pair;
    const fed=pr.filter(x=>outs.includes(x)||((x==='any'||x==='ele')&&outs.some(o=>EXP[x].includes(o))));
    if(!fed.length) continue;
    const other=pr.filter(x=>!fed.includes(x));
    res.push({k:rk,on:wild?pr.every(x=>own.has(x)):other.every(x=>own.has(x))});
  }
  return res;
}

function choose(i){
  const c=S.choices[i]; if(!c)return;
  const p=S.p;
  if(c.mu){
    S.mu[c.mu]=(S.mu[c.mu]||0)+1; S.muMode=0; p.hp=Math.min(p.max,p.hp+p.max*0.3);
    banner('詛咒：'+MU[c.mu].n,MU[c.mu].c);
    if(S.pend>0){ S.mode='levelup'; S.choices=genChoices(); showPick(); } else { S.mode='play'; p.inv=Math.max(p.inv,1); hideOv(); }
    updHUD(); return;
  }
  if(c.f){
    if(c.f==='heal') p.hp=Math.min(p.max,p.hp+p.max*0.4);
    else if(c.f==='guard') p.sh=shMax();
  } else if(c.r){ S.res[c.r]=1; sfx('res'); banner('共鳴：'+RES[c.r].n,REACT[c.r].c); }
  else if(c.rl){ S.rl[c.rl]=1; sfx('res'); banner('聖物：'+RL[c.rl].n,RL[c.rl].c); }
  else if(c.ct){ S.ct[c.ct]=(S.ct[c.ct]||0)+1; sfx('warn');
    if(c.ct==='blood'){ p.max=Math.max(30,Math.round(p.max*0.8)); p.hp=Math.min(p.hp,p.max); }
    if(c.ct==='trial') later(0.6,()=>spawnElites(1));
    banner('契約：'+CT[c.ct].n,CT[c.ct].c); }
  else if(c.asc){ S.asc++; sfx('res'); }
  else if(c.ms){ S.ms[c.ms]=(S.ms[c.ms]||0)+1; sfx('res'); }
  else if(c.tm){ const [a,b]=c.tm, i2=S.order.indexOf(a); if(i2>=0){ S.sk[b]={...S.sk[a],cd:0.4,pos:[]}; delete S.sk[a]; S.order[i2]=b; banner('重組：'+SK[a].ch+' → '+SK[b].ch,SK[b].c); sfx('res'); } }
  else if(c.fz){ doFuse(...c.fz); }
  else if(c.fz3){ doTri(...c.fz3); }
  else if(c.pv){
    if(S.pv[c.pv]) S.pv[c.pv]++; else { S.pv[c.pv]=1; S.porder.push(c.pv); }
    if(c.pv==='vit'){ p.max+=25; p.hp=Math.min(p.max,p.hp+25); }
    if(c.pv==='ward') p.sh=Math.min(shMax(),p.sh+15);
  }
  else if(S.sk[c.id]) S.sk[c.id].lv++;
  else { S.sk[c.id]={lv:1,cd:0.4,ang:0,acc:0,pos:[]}; S.order.push(c.id); }
  renderSlots();
  if(S.startPick) S.startPick=false;
  else { S.pend--; if(S.pc>0) S.pc--; }
  if(S.pend>0){ S.mode='levelup'; S.choices=genChoices(); showPick(); }
  else { S.mode='play'; p.inv=Math.max(p.inv,0.6); hideOv(); }
  updHUD();
}

   玩家之間用「成績碼」交換成績，貼進排行榜就能一起比。成績碼有校驗碼，打錯或亂改會被擋下。 */
/* ===== 全球排行榜設定（Firebase Firestore）=====
   把 Firebase 專案的 projectId 和 apiKey 填在這裡就會啟用；留空則只有本機排行榜。
   apiKey 本來就是公開的，安全性由 Firestore 的安全規則負責。 */
const ONLINE={projectId:'resonance-3c16c',apiKey:'AIzaSyCfiDU3t24crHJ--IXsfQWrkG948I9QSYU'};
const onlineOn=()=>!!(ONLINE.projectId&&ONLINE.apiKey);
const fsBase=()=>`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(ONLINE.projectId)}/databases/(default)/documents`;
async function fsFetch(url,body){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'key='+encodeURIComponent(ONLINE.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok) throw new Error('http '+r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
async function fsSubmit(e){
  const I=v=>({integerValue:String(v|0)}), T=v=>({stringValue:String(v)});
  await fsFetch(fsBase()+'/scores',{fields:{name:T(e.name),sc:T(e.sc),t:I(e.t),k:I(e.k),lv:I(e.lv),b:I(e.b),sk:T(e.sk),d:I(e.d),v:I(1)}});
}
let gCache=null;
async function fsTop(){
  if(gCache&&performance.now()-gCache.at<30000) return gCache.list;
  const rows=await fsFetch(fsBase()+':runQuery',{structuredQuery:{from:[{collectionId:'scores'}],orderBy:[{field:{fieldPath:'t'},direction:'DESCENDING'}],limit:80}});
  const out=[], seen=new Set();
  for(const row of rows||[]){
    const f=row&&row.document&&row.document.fields; if(!f) continue;
    const str=k=>f[k]&&f[k].stringValue!=null?String(f[k].stringValue):'', num=k=>f[k]&&f[k].integerValue!=null?parseInt(f[k].integerValue,10)||0:0;
    const e={name:cleanName(str('name'))||'無名旅人',sc:SCHOOL[str('sc')]?str('sc'):'',t:num('t'),k:num('k'),lv:Math.max(1,num('lv')),b:num('b'),sk:str('sk').slice(0,12)};
    if(seen.has(e.name)) continue; seen.add(e.name); out.push(e);   // 每個暱稱只留最佳成績
  }
  out.sort((a,b)=>b.t-a.t||b.k-a.k);
  gCache={at:performance.now(),list:out.slice(0,50)};
  return gCache.list;
}
function loadGlobal(){
  const box=$('gList'); if(!box) return;
  fsTop().then(list=>{ const b=$('gList'); if(!b) return; const me=getName();
    b.innerHTML=list.length?list.map((e,i)=>lbRow({...e,own:!!me&&e.name===me},i)).join(''):'<p class="note">還沒有人上榜，當第一個吧。</p>'; })

}

const LB_KEY='resonance-lb', NAME_KEY='resonance-name', LB_SALT='共鳴/resonance/lb/v1';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName=x=>String(x||'').replace(/[\u0000-\u001f\u007f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,10);
function getName(){ try{ return cleanName(localStorage.getItem(NAME_KEY)); }catch(_){ return ''; } }
function setName(n){ try{ localStorage.setItem(NAME_KEY,cleanName(n)); }catch(_){} }
function hash32(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(36); }
function b64e(x){ const b=new TextEncoder().encode(x); let s=''; for(const c of b) s+=String.fromCharCode(c); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(x){ x=x.replace(/-/g,'+').replace(/_/g,'/'); while(x.length%4) x+='='; const s=atob(x), b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return new TextDecoder().decode(b); }
function encodeEntry(e){ const pl=b64e(JSON.stringify([1,e.name,e.sc,e.t,e.k,e.lv,e.b,e.sk,e.d])); return 'RES1.'+pl+'.'+hash32(LB_SALT+pl); }
const CODE_RE=/RES1\.[A-Za-z0-9_-]{8,400}\.[0-9a-z]{1,8}/g;
function decodeCode(code){
  const m=/^RES1\.([A-Za-z0-9_-]+)\.([0-9a-z]+)$/.exec(code); if(!m||hash32(LB_SALT+m[1])!==m[2]) return null;
  try{
    const a=JSON.parse(b64d(m[1])); if(!Array.isArray(a)||a[0]!==1) return null;
    const [,name,sc,t,k,lv,b,sk,d]=a, int=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
    if(typeof name!=='string'||typeof sk!=='string'||(sc!==''&&!SCHOOL[sc])) return null;
    if(!int(t,0,86400)||!int(k,0,1e7)||!int(lv,1,999)||!int(b,0,999)||!int(d,0,1e6)||sk.length>12) return null;
    return {name:cleanName(name)||'無名旅人',sc,t,k,lv,b,sk,d,code};
  }catch(_){ return null; }
}
function lbLoad(){ try{ const a=JSON.parse(localStorage.getItem(LB_KEY)||'[]'); return Array.isArray(a)?a.filter(x=>x&&x.code):[]; }catch(_){ return []; } }
function lbSave(a){ try{ localStorage.setItem(LB_KEY,JSON.stringify(a)); }catch(_){} }
function lbPut(ent,dropCode){
  const a=lbLoad().filter(x=>x.code!==ent.code&&x.code!==dropCode); a.push(ent);
  a.sort((x,y)=>y.t-x.t||y.k-x.k); const keep=a.slice(0,100); lbSave(keep);
  return keep.findIndex(x=>x.code===ent.code)+1;
}

function importCodes(){
  const box=$('imp'), msg=$('impMsg'); if(!box)return;
  const found=[...new Set(box.value.match(CODE_RE)||[])]; let ok=0, bad=0, dup=0; const have=new Set(lbLoad().map(x=>x.code));
  for(const c of found){ const e=decodeCode(c); if(!e){ bad++; continue; } if(have.has(c)){ dup++; continue; } lbPut(e); have.add(c); ok++; }
  boardTab='local'; showOv(boardHTML()); const m=$('impMsg');
  if(m) m.textContent=found.length?`加入 ${ok} 筆${dup?`，${dup} 筆已經在榜上`:''}${bad?`，${bad} 筆成績碼無效`:''}`:'沒有找到成績碼';
}

/* 暫停畫面：戰鬥中只顯示主動、被動，其餘資訊都在這裡，並附上效果說明 */
function pauseHTML(){
  const own=ownedEls(), act=Object.keys(REACT).filter(k=>REACT[k].pair.every(x=>own.has(x)));
  let h=`<div class="panel pz"><h2>暫停</h2><p class="sub">${S.endless?'無盡模式，已存活 '+fmt(S.t):'剩餘 '+fmt(WIN_T-S.t)}，Lv ${S.p.lv}，${S.kills} 擊殺</p>`;
  if(S.boss&&!S.boss.dead){ const B=BOSS[S.boss.boss]; h+=`<p class="note" style="text-align:left;color:${B.c}">${B.n}｜考驗：${B.test}</p><p class="sub">${B.tip}</p>`; }
  h+=`<div class="pzsec">主動技能<small>${S.order.length} / ${MAX_SLOTS}</small></div>`;
  for(const id of S.order){ const d=SK[id], s=S.sk[id];
    if(d.fz) h+=pzRow(d.c,badgeHTML(d),d.n,d.tri?'三合一':'二合一',d.parts.map(p=>`<b style="color:${SK[p].c}">${SK[p].n}</b>　${SK[p].d[0]}<br><span class="q">${SK[p].d[SKMAX-1]}</span>`).join('<br>'),d.tri);
    else h+=pzRow(d.c,d.ch,d.n,`Lv ${s.lv} / ${SKMAX}`,d.d[0]+(s.lv>=SKMAX?`<br><span class="q">${d.d[SKMAX-1]}</span>`:`<br><span class="mu">Lv${SKMAX}　${d.d[SKMAX-1]}</span>`));
  }
  if(S.porder.length){ h+=`<div class="pzsec">被動<small>${S.porder.length} / ${MAX_PV}</small></div>`;
    for(const id of S.porder){ const d=PV[id], l=S.pv[id]; h+=pzRow(d.c,d.ch,d.n,`Lv ${l} / ${PVMAX}`,txtOf(d.d,l)); } }
  const fk=Object.keys(S.fu||{}), tk=Object.keys(S.fu3||{});
  h+=`<div class="pzsec">融合<small>${S.order.filter(x=>SK[x].fz).length} / ${FZ_MAX}</small></div>`;
  if(!fk.length&&!tk.length) h+=`<p class="pzhint">兩個不同元素的技能都練到 Lv${SKMAX}，升級時可以在技能欄裡二合一，並解鎖這組元素的融合效果。</p>`;
  for(const k of tk) h+=pzRow('#f2c46d','三',FZ3[k].n,'三元素',FZ3[k].d+'三種元素在 2 秒內打中同一個敵人時觸發。');
  for(const k of fk){ const es=k.split('|'), A=FZ[k][es[0]], B=FZ[k][es[1]];
    h+=pzRow('#f2c46d','融',fzLabel(k),'',`<b style="color:${COL[es[1]]}">${A.n}</b>　${A.d}<br><b style="color:${COL[es[0]]}">${B.n}</b>　${B.d}`); }
  const rk=Object.keys(S.res), prog=Object.keys(REACT).filter(k=>!S.res[k]&&(act.includes(k)||S.rc[k]));
  h+=`<div class="pzsec">共鳴<small>${rk.length}</small></div>`;
  for(const k of rk) h+=pzRow(REACT[k].c,REACT[k].n[0],RES[k].n,REACT[k].n+'的共鳴',RES[k].d);
  for(const k of prog){ const n=S.rc[k]||0, Rx=REACT[k], st=n>=resNeed()?`<span class="st ok">可共鳴</span>`:`<span class="st">${n} / ${resNeed()}</span>`;
    h+=`<div class="prog" style="--c:${Rx.c}"><span class="nm">${Rx.n}</span><span class="tr"><i style="width:${Math.min(100,n/resNeed()*100)}%"></i></span>${st}</div>`; }
  if(!rk.length&&!prog.length) h+=`<p class="pzhint">同一種反應觸發 ${resNeed()} 次，就能選擇它的共鳴。</p>`;
  const ex=[];
  for(const k in S.rl) ex.push(pzRow(RL[k].c,RL[k].ch,RL[k].n,'聖物',RL[k].d));
  for(const k in S.ct) ex.push(pzRow(CT[k].c,CT[k].ch,CT[k].n,'契約 ×'+S.ct[k],CT[k].d));
  for(const k in S.mu) ex.push(pzRow(MU[k].c,MU[k].ch,MU[k].n,'詛咒'+(S.mu[k]>1?' ×'+S.mu[k]:''),MU[k].d));
  for(const k in S.ms) ex.push(pzRow(REACT[k].c,'精',REACT[k].n+'精通','×'+S.ms[k],`${REACT[k].n}傷害 +${20*S.ms[k]}%。`));
  if(S.asc) ex.push(pzRow('#f2c46d','昇','昇華','×'+S.asc,`所有反應傷害 +${6*S.asc}%。`));
  if(ex.length) h+=`<div class="pzsec">聖物與強化<small>${ex.length}</small></div>`+ex.join('');
  h+=`<div class="pzsec">目前能觸發的反應</div><div class="cl">${act.length?act.map(k=>`<span class="chip on" style="--c:${REACT[k].c}">${REACT[k].n}</span>`).join(''):'<span class="supt">還沒有。試著拿兩種不同元素的技能。</span>'}</div>`;
  h+=`<div class="pzbtns"><button class="btn primary" data-act="resume">繼續</button><button class="btn" data-act="codex">圖鑑</button><button class="btn" data-act="sound">音效：${AU.on?'開':'關'}</button><button class="btn" data-act="fxlite">特效：${FXL?'精簡':'完整'}</button><button class="btn" data-act="restart">重新開始</button><button class="btn" data-act="home">回到標題</button></div></div>`;
  return h;
}

function endGame(win){
  S.mode='over'; input.active=false; input.id=null;
  const entries=Object.entries(S.dmg).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((a,[,v])=>a+v,0)||1;
  const rEntries=entries.filter(([k])=>REACT[k]);
  const rTotal=rEntries.reduce((a,[,v])=>a+v,0), share=rTotal/total;
  const nReact=Object.values(S.rc).reduce((a,b)=>a+b,0);
  let school='苦行者', sub='幾乎只靠技能本身硬撐', sc='#cfcbe0';
  if(share>=0.3&&rEntries.length){
    const top=rEntries[0][0]; school=SCHOOL[top]; sc=REACT[top].c;
    sub=rEntries.slice(0,2).map(([k])=>REACT[k].n).join('與')+'為主的打法';
  }
  const slain=!!S.bossDown, B=BOSS[S.boss&&S.boss.mid?S.boss.boss:S.bossK], met=!!S.boss;
  const best=loadBest(), score=(slain?2e6:win?1e6:0)+S.t;
  if(!S.endless&&(!best||score>(best.slain?2e6:best.win?1e6:0)+best.time)) saveBest({time:S.t,win,slain,school});
  const bars=entries.slice(0,7).map(([k,v])=>{
    const nm=SK[k]?SK[k].n:REACT[k]?REACT[k].n:PV[k]?PV[k].n:MISC[k]?MISC[k][0]:k, c=SK[k]?SK[k].c:REACT[k]?REACT[k].c:PV[k]?PV[k].c:MISC[k]?MISC[k][1]:'#999', pc=v/total*100;
    return `<div class="bar" style="--c:${c}"><span class="nm">${nm}</span><span class="tr"><i style="width:${Math.max(2,pc)}%"></i></span><span class="pc">${pc.toFixed(0)}%</span></div>`;
  }).join('');
  if(S.endless) return endlessOver(entries,total,share,rEntries,school,sc,sub,bars);
  showOv(`<div class="panel">
    <h2>${slain?'討伐成功':win?'撐過來了':'倒下了'}</h2>
    <p class="sub">${slain?`${B.n}在 ${Math.round(S.bossDown-S.boss.t0)} 秒內倒下。這套組合解開了它的題目：${B.test}。`:win?(met?`5 分鐘結束，但${B.n}還站著。它考的是「${B.test}」。`:'5 分鐘結束，場上的元素全都聽你的。'):(met?`存活 ${fmt(S.t)}，敗給${B.n}。`:'存活 '+fmt(S.t)+'。換個組合再來一次。')}</p>
    ${met&&!slain?`<p class="note" style="text-align:left">${B.fail}</p>`:''}
    <div class="school" style="--c:${sc}"><small>你的流派</small><strong>${school}</strong><span>${sub}</span></div>
    <div class="stats"><div><b>${S.p.lv}</b><small>等級</small></div><div><b>${S.kills}</b><small>擊殺</small></div><div><b>${nReact}</b><small>觸發反應</small></div></div>
    <p class="note">反應造成了 ${(share*100).toFixed(0)}% 的總傷害${Object.keys(S.res).length?'<br>共鳴：'+Object.keys(S.res).map(k=>RES[k].n).join('、'):''}${S.fu&&Object.keys(S.fu).length?'<br>融合：'+Object.keys(S.fu).map(fzLabel).join('、'):''}</p>
    <h3>傷害來源</h3><div class="bars">${bars||'<p class="sub">沒有造成傷害</p>'}</div>
    <button class="btn primary" data-act="restart">再來一局</button>
    <button class="btn" data-act="home">回到標題</button>
  </div>`);
}

  else if(a==='endless') newGame('endless');

  else if(a==='board'){ boardBack=S&&S.mode==='over'?'over':'title'; if(boardBack==='over') S.overHTML=el.ov.innerHTML; showBoard(); }
  else if(a==='boardback'){ if(boardBack==='over'&&S&&S.overHTML){ showOv(S.overHTML); const box=$('codeBox'); if(box&&S.lbEnt) box.value=S.lbEnt.code; } else showTitle(); }
  else if(a==='import') importCodes();
  else if(a==='share') shareResult();
  else if(a==='upload') uploadResult();
  else if(a==='evoback'){ if(S&&S.evoPrev){ S.choices=S.evoPrev; S.evoPrev=null; S.evoMode=0; showPick(); } }
  else if(a==='tab'){ boardTab=b.dataset.t; showBoard(); }

  else if(a==='sel'){ const i=+b.dataset.i; if(S.sel===i){ if(performance.now()-S.pickAt<250)return; choose(i); } else { S.sel=i; showPick(true); } }
  else if(a==='pick'){ if(performance.now()-S.pickAt<350)return; choose(+b.dataset.i); }
  else if(a==='reroll'){ if(S.rerolls>0||S.rl.echo){ if(!S.rl.echo) S.rerolls--; S.choices=genChoices(); showPick(); } }
  else if(a==='codex'){ codexBack=S&&S.mode==='pause'?'pause':'title'; showOv(codexHTML()); }
  else if(a==='back'){ if(codexBack==='pause'&&S) showOv(pauseHTML()); else showTitle(); }

  else if(a==='home'){ S=null; el.hud.classList.add('hidden'); showTitle(); }
});

/* ---------- 繪製 ---------- */
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function drawIdle(t){
  ctx.save();
  ctx.save(); ctx.translate(-((t*12)%256),-((t*7)%256)); drawBg(0,0,W+256,H+256); ctx.restore();
  const g=48, ox=(t*12)%g, oy=(t*7)%g;
  ctx.beginPath();
  for(let x=-ox;x<W;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=-oy;y<H;y+=g){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.strokeStyle='rgba(150,140,230,0.06)'; ctx.lineWidth=1; ctx.stroke();
  const cols=[COL.burn,COL.wet,COL.chill,COL.shock,COL.oil], pts=[];
  for(let i=0;i<5;i++){
    const a=t*0.25+i*TAU/5, rr=Math.min(W,H)*0.36*(0.85+0.15*Math.sin(t*0.9+i*1.7));
    pts.push([W/2+Math.cos(a)*rr, H*0.42+Math.sin(a)*rr*0.8]);
  }
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++)for(let j=i+1;j<5;j++){
    const pulse=0.5+0.5*Math.sin(t*1.3+i*2+j);
    ctx.strokeStyle=cols[i]; ctx.globalAlpha=0.05+0.1*pulse; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pts[i][0],pts[i][1]); ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke();
  }
  for(let i=0;i<5;i++){
    ctx.globalAlpha=0.16; ctx.fillStyle=cols[i]; circle(pts[i][0],pts[i][1],30); ctx.fill();
    ctx.globalAlpha=0.9; circle(pts[i][0],pts[i][1],5); ctx.fill();
  }
  ctx.restore();
}
function poly(x,y,r,n,a){ ctx.beginPath(); for(let i=0;i<n;i++){ const b=a+i*TAU/n, px=x+Math.cos(b)*r, py=y+Math.sin(b)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.closePath(); }
function drawPick(g,t){
  const bob=Math.sin(t*4+g.x*0.05)*2, y=g.y+bob;
  if(g.k==='cry'){
    if(g.l<2&&Math.floor(g.l*8)%2===0) return;
    const c=COL[g.el];
    ctx.globalAlpha=0.25; ctx.fillStyle=c; circle(g.x,y,11); ctx.fill(); ctx.globalAlpha=1;
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*TAU/6+Math.PI/6, x=g.x+Math.cos(a)*6, yy=y+Math.sin(a)*6; i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); } ctx.closePath();
    ctx.fillStyle=c; ctx.fill(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.2; ctx.stroke();
    return;
  }
  const P={food:['補','#ff7d96'],mag:['吸','#46f0b4'],chest:['寶','#f2c46d']}[g.k], r=g.k==='chest'?13:10;
  if(g.k==='chest'){ ctx.globalAlpha=0.25+0.15*Math.sin(t*5); ctx.fillStyle=P[1]; circle(g.x,y,r+7); ctx.fill(); ctx.globalAlpha=1; }
  ctx.fillStyle='rgba(13,15,31,0.92)'; circle(g.x,y,r); ctx.fill();
  ctx.strokeStyle=P[1]; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=P[1]; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`900 ${Math.round(r*1.15)}px ${SERIF}`; ctx.fillText(P[0],g.x,y+1);
}
function edgeArrow(wx,wy,c){
  const p=S.p, x0=(wx-p.x)*ZOOM+W/2, y0=(wy-p.y)*ZOOM+H/2;
  if(x0>-8&&x0<W+8&&y0>-8&&y0<H+8) return;
  const a=Math.atan2(y0-H/2,x0-W/2), ca=Math.cos(a), sa=Math.sin(a), m=22;
  const k=Math.min((W/2-m)/Math.max(1e-6,Math.abs(ca)),(H/2-m)/Math.max(1e-6,Math.abs(sa)));
  ctx.save(); ctx.translate(W/2+ca*k,H/2+sa*k); ctx.rotate(a); ctx.globalAlpha=0.85; ctx.fillStyle=c;
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,7); ctx.lineTo(-6,-7); ctx.closePath(); ctx.fill(); ctx.restore();
}
/* ===================== 美術：精靈快取、敵人與首領造型 =====================
   造型參考霓虹向量風（Geometry Wars、20 Minutes Till Dawn 的剪影＋發光眼）：
   深色剪影、元素色描邊與光暈、會朝向玩家、會擺動的腳。發光效果事先畫進快取，執行時只貼圖。 */

    if(o.k==='bolt'){ drawTrail(trail(o,10),'#ff7a3d',9); bloom(o.x,o.y,22,'#ff7a3d',0.95); bloom(o.x,o.y,9,'#ffe2b0',1); }
    else if(o.k==='lance'){ drawTrail(trail(o,8),'#7fd6ff',6); bloom(o.x,o.y,17,'#7fd6ff',0.75); ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(Math.atan2(o.vy,o.vx));
      ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-3,5); ctx.lineTo(-16,0); ctx.lineTo(-3,-5); ctx.closePath(); ctx.fillStyle='#effcff'; ctx.fill(); ctx.strokeStyle='#9fe8ff'; ctx.lineWidth=1.3; ctx.stroke(); ctx.restore(); }
    else if(o.k==='flask'){ const k=Math.min(1,o.t/o.dur), x=o.sx+(o.tx-o.sx)*k, y=o.sy+(o.ty-o.sy)*k, h=Math.sin(Math.PI*k)*50;
      runeRing(o.tx,o.ty,o.r*0.6,COL.oil,k,t,4,1); bloom(x,y-h,12,COL.oil,0.7);
      ctx.save(); ctx.translate(x,y-h); ctx.rotate(k*9); ctx.fillStyle=COL.oil; circle(0,1,5); ctx.fill(); ctx.fillRect(-1.6,-7,3.2,5); ctx.fillStyle='rgba(255,240,200,0.85)'; circle(-1.5,0,1.5); ctx.fill(); ctx.restore(); }
    else if(o.k==='xs'){ const c=o.c||'#ffffff'; drawTrail(trail(o,8),o.c2||c,o.sz*1.9); bloom(o.x,o.y,o.sz*3.8,c,0.9); ctx.fillStyle='#ffffff'; circle(o.x,o.y,o.sz*0.55); ctx.fill(); }
    else if(o.k==='xk'){ const k=Math.min(1,o.t/o.dur), h=(1-k)*150, c=o.c||'#ffffff';
      if(o.P&&o.P.spk){ const u=Math.max(0,(k-0.45)/0.55); bloom(o.x,o.y,o.r*k,c,0.5*k);
        ctx.fillStyle=hexA(hx6(o.c2||c),0.95*u); ctx.beginPath(); ctx.moveTo(o.x-8,o.y+5); ctx.lineTo(o.x-2,o.y-9-22*u); ctx.lineTo(o.x+3,o.y-4-13*u); ctx.lineTo(o.x+8,o.y+5); ctx.closePath(); ctx.fill(); }
      else { runeRing(o.x,o.y,o.r,hx6(c),0.4+0.6*k,t,5,1.6); ctx.strokeStyle=hexA(hx6(c),0.35*k); ctx.lineWidth=1.2; ctx.setLineDash([2,6]); ctx.lineDashOffset=t*50; circle(o.x,o.y,o.r*0.62); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset=0;
        bloom(o.x,o.y,o.r*1.1*k,c,0.35*k);
        ctx.strokeStyle=hexA(hx6(o.c2||c),0.5); ctx.lineWidth=8; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(o.x+18*(1-k),o.y-h-40); ctx.lineTo(o.x,o.y-h); ctx.stroke(); ctx.lineCap='butt';
        bloom(o.x,o.y-h,18+6*k,o.c2||c,1); ctx.fillStyle='#ffffff'; circle(o.x,o.y-h,2.6+1.8*k); ctx.fill(); } }
    else if(o.k==='xn'){ const a=1-Math.min(1,o.t/(o.dur+0.12)), cx=o.cx!=null?o.cx:p.x, cy=o.cy!=null?o.cy:p.y, c=hx6(o.c||'#ffffff');
      bloom(cx,cy,o.R*0.7,c,0.45*a*a); ctx.strokeStyle=hexA(c,0.25*a); ctx.lineWidth=16; circle(cx,cy,Math.max(1,o.rad-7)); ctx.stroke(); ctx.strokeStyle=hexA(c,0.9*a); ctx.lineWidth=2.5; circle(cx,cy,o.rad); ctx.stroke(); ctx.strokeStyle=`rgba(255,255,255,${0.7*a})`; ctx.lineWidth=1; circle(cx,cy,o.rad+3); ctx.stroke(); }
    else if(o.k==='gale'){ const k=Math.min(1,o.l/0.4); bloom(o.x,o.y,o.r*1.25,'#5ee6d0',0.35*k); ctx.lineWidth=2.4;
      for(let i=0;i<5;i++){ const a0=t*9+i*TAU/5; ctx.strokeStyle=`rgba(160,255,238,${0.65*k})`; ctx.beginPath(); for(let j=0;j<=10;j++){ const u=j/10, a=a0+u*2.6, rr=o.r*(0.12+0.88*u), x=o.x+Math.cos(a)*rr, y=o.y+Math.sin(a)*rr; j?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); }
      for(let i=0;i<6;i++){ const a=-t*6+i*TAU/6, rr=o.r*(0.6+0.3*Math.sin(t*5+i)); bloom(o.x+Math.cos(a)*rr,o.y+Math.sin(a)*rr,4,'#e8fffb',0.9*k); }
      if(o.carry){ ctx.strokeStyle=hexA(COL[o.carry],0.8*k); ctx.lineWidth=3; const a0=-t*7; ctx.beginPath(); ctx.arc(o.x,o.y,o.r*0.55,a0,a0+2.6); ctx.stroke(); ctx.beginPath(); ctx.arc(o.x,o.y,o.r*0.55,a0+3.14,a0+5.74); ctx.stroke(); } }
    else if(o.k==='rock'){ const k=Math.min(1,o.t/o.dur), h=(1-k)*160, rr=8+4*k;
      runeRing(o.x,o.y,o.r,'#e7b04f',0.4+0.6*k,t,5,1.6); bloom(o.x,o.y,o.r*1.1*k,'#e7b04f',0.35*k);
      ctx.strokeStyle='rgba(255,170,80,0.45)'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(o.x+14*(1-k),o.y-h-40); ctx.lineTo(o.x,o.y-h); ctx.stroke(); ctx.lineCap='butt'; bloom(o.x,o.y-h,22,'#ff9a4d',0.9);
      ctx.globalCompositeOperation='source-over'; ctx.save(); ctx.translate(o.x,o.y-h); ctx.rotate(t*4+o.x); ctx.beginPath();
      for(let i=0;i<7;i++){ const a=i*TAU/7, q=rr*(i%2?0.82:1.05); i?ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q):ctx.moveTo(Math.cos(a)*q,Math.sin(a)*q); } ctx.closePath();
      ctx.fillStyle='#4a2a10'; ctx.fill(); ctx.strokeStyle=o.el?COL[o.el]:'#ffd27a'; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore(); ctx.globalCompositeOperation='lighter'; }
    else if(o.k==='wave'){ const a=1-Math.min(1,o.t/(o.dur+0.15));
      ctx.strokeStyle=`rgba(63,169,255,${0.28*a})`; ctx.lineWidth=18; circle(p.x,p.y,Math.max(1,o.rad-8)); ctx.stroke(); ctx.strokeStyle=`rgba(180,228,255,${0.95*a})`; ctx.lineWidth=2.5; circle(p.x,p.y,o.rad); ctx.stroke();
      for(let i=0;i<16;i++){ const b=i*TAU/16+o.t*3; bloom(p.x+Math.cos(b)*(o.rad+4),p.y+Math.sin(b)*(o.rad+4),5,'#bfe6ff',0.9*a); } }
    else if(o.k==='ebb'){ const a=1-Math.min(1,o.t/o.dur);
      ctx.strokeStyle=`rgba(140,205,255,${0.75*a})`; ctx.lineWidth=3; ctx.setLineDash([10,7]); circle(p.x,p.y,o.rad); ctx.stroke(); ctx.setLineDash([]); }
  }
  for(const f of S.FX){ if(f.k!=='ln'&&f.k!=='cone') continue; const k=Math.max(0,f.l/f.m), c=hx6(f.c);
    if(f.k==='ln'){ ctx.lineCap='round'; ctx.strokeStyle=hexA(c,0.22*k); ctx.lineWidth=f.w*2.8; ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke();
      ctx.strokeStyle=hexA(c,0.8*k); ctx.lineWidth=f.w*0.9*k+1.5; ctx.stroke(); ctx.strokeStyle=`rgba(255,255,255,${0.95*k})`; ctx.lineWidth=Math.max(1,f.w*0.3*k); ctx.stroke(); ctx.lineCap='butt';
      bloom(f.x1,f.y1,f.w*2.2,c,0.9*k); bloom(f.x2,f.y2,f.w*3,c,0.95*k); }
    else { const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.len); g.addColorStop(0,hexA(c,0.5*k)); g.addColorStop(0.7,hexA(c,0.2*k)); g.addColorStop(1,hexA(c,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.arc(f.x,f.y,f.len,f.a-f.ang/2,f.a+f.ang/2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=hexA(c,0.95*k); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x,f.y,f.len*(1.05-0.25*k),f.a-f.ang/2,f.a+f.ang/2); ctx.stroke();
      ctx.lineWidth=1.5; for(let i=0;i<5;i++){ const b=f.a+(i/4-0.5)*f.ang*0.9, r1=f.len*0.35, r2=f.len*(0.95-0.2*k); ctx.strokeStyle=hexA(c,0.55*k); ctx.beginPath(); ctx.moveTo(f.x+Math.cos(b)*r1,f.y+Math.sin(b)*r1); ctx.lineTo(f.x+Math.cos(b)*r2,f.y+Math.sin(b)*r2); ctx.stroke(); } }
  }
  for(const h of S.H){ if(h.k!=='shot'||!vis(h.x,h.y,12))continue; ctx.fillStyle=`rgba(${h.c},0.35)`; circle(h.x,h.y,h.r+5); ctx.fill(); ctx.fillStyle=`rgb(${h.c})`; circle(h.x,h.y,h.r); ctx.fill(); ctx.fillStyle='#ffffff'; circle(h.x,h.y,h.r*0.45); ctx.fill(); }
  for(const f of S.FX){
    const k=Math.max(0,f.l/f.m);
    if(f.k==='ln'||f.k==='cone') continue;
    if(f.k==='pt'){ const v=Math.abs(f.vx)+Math.abs(f.vy); ctx.globalAlpha=k;
      if(v>60){ ctx.strokeStyle=f.c; ctx.lineWidth=f.s*0.85; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x-f.vx*0.05,f.y-f.vy*0.05); ctx.stroke(); ctx.lineCap='butt'; }
      else { ctx.fillStyle=f.c; circle(f.x,f.y,f.s*0.6); ctx.fill(); } }
    else if(f.k==='boom'){ const r=f.r*(0.45+0.55*(1-k*k)); ctx.globalAlpha=1; bloom(f.x,f.y,f.r*1.8,f.c,0.9*k*k);
      ctx.globalAlpha=0.26*k; ctx.fillStyle=f.c; circle(f.x,f.y,r); ctx.fill(); ctx.globalAlpha=0.95*k; ctx.strokeStyle=f.c; ctx.lineWidth=1+5*k; ctx.stroke();
      if(k>0.5){ ctx.globalAlpha=(k-0.5)*2; ctx.fillStyle='#ffffff'; circle(f.x,f.y,r*0.3); ctx.fill(); } }
    else if(f.k==='ring'){ const r=f.r*(0.3+0.7*(1-k)); ctx.globalAlpha=0.3*k; ctx.strokeStyle=f.c; ctx.lineWidth=10; circle(f.x,f.y,r); ctx.stroke(); ctx.globalAlpha=k; ctx.lineWidth=2.2; ctx.stroke(); }
    else if(f.k==='bolt'){ ctx.globalAlpha=k; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(f.pts[0],f.pts[1]); for(let i=2;i<f.pts.length;i+=2)ctx.lineTo(f.pts[i],f.pts[i+1]);
      ctx.strokeStyle=hexA(hx6(f.c),0.28); ctx.lineWidth=10; ctx.stroke(); ctx.strokeStyle=f.c; ctx.lineWidth=3; ctx.stroke(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.1; ctx.stroke(); ctx.lineJoin='miter';
      const n=f.pts.length; ctx.globalAlpha=1; bloom(f.pts[n-2],f.pts[n-1],16,f.c,k); bloom(f.pts[0],f.pts[1],10,f.c,0.7*k); }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  // 反應文字
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  for(const tx of S.TX){
    const k=tx.l/tx.m; ctx.globalAlpha=Math.min(1,k*3);
    ctx.font=`900 ${Math.round(15*tx.sc)}px ${SERIF}`;
    ctx.lineWidth=3.5; ctx.strokeStyle='rgba(8,8,20,0.85)'; ctx.strokeText(tx.s,tx.x,tx.y);
    ctx.fillStyle=tx.c; ctx.fillText(tx.s,tx.x,tx.y);
  }
  ctx.globalAlpha=1;

  // 螢幕空間
  ctx.setTransform(DPR,0,0,DPR,0,0);
  { const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.38,W/2,H/2,Math.max(W,H)*0.78); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,6,0.5)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H); }
  if(S.mu.fog){ const fg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.26,W/2,H/2,Math.max(W,H)*0.62);
    fg.addColorStop(0,'rgba(6,4,14,0)'); fg.addColorStop(1,'rgba(6,4,14,0.93)'); ctx.fillStyle=fg; ctx.fillRect(0,0,W,H); }
  if(S.wx){ const k=Math.max(0,Math.min(1,S.wxT/1.5,(22-S.wxT)/1.5));
    if(S.wx==='rain'){ ctx.strokeStyle=`rgba(120,180,255,${0.35*k})`; ctx.lineWidth=1; ctx.beginPath();
      for(let i=0;i<70;i++){ const x=((i*137.5+now*90)%(W+60))-30, y=((i*89.3+now*620)%(H+80))-40; ctx.moveTo(x,y); ctx.lineTo(x-6,y+16); } ctx.stroke(); }
    else if(S.wx==='snow'){ ctx.fillStyle=`rgba(230,245,255,${0.6*k})`;
      for(let i=0;i<60;i++){ const x=((i*97.1+Math.sin(now+i)*20+now*25)%(W+20))-10, y=((i*61.7+now*55)%(H+20))-10; ctx.fillRect(x,y,2,2); } }
    else if(S.wx==='heat'){ ctx.fillStyle=`rgba(255,110,40,${0.08*k})`; ctx.fillRect(0,0,W,H); }
    else if(S.wx==='storm'){ ctx.fillStyle=`rgba(10,10,30,${0.22*k})`; ctx.fillRect(0,0,W,H); }
  }
  if(S.flash>0){ ctx.fillStyle=`rgba(255,248,225,${Math.min(0.45,S.flash)})`; ctx.fillRect(0,0,W,H); }
  const low=p.hp/p.max<0.3?0.18+0.1*Math.sin(now*6):0, hv=Math.max(low,S.hurt>0?S.hurt*0.9:0);
  if(hv>0){
    const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.72);
    gr.addColorStop(0,'rgba(255,40,80,0)'); gr.addColorStop(1,`rgba(255,40,80,${Math.min(0.5,hv)})`);
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  }
  for(const e of S.E) if(e.elite) edgeArrow(e.x,e.y,e.boss?e.c:'#ff2d55');
  for(const g of S.G) if(g.k==='chest') edgeArrow(g.x,g.y,'#f2c46d');
  if(input.active&&S.mode==='play'){
    const dx=input.cx-input.ox, dy=input.cy-input.oy, l=Math.hypot(dx,dy), m=Math.min(l,48), kx=l?dx/l*m:0, ky=l?dy/l*m:0;
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=2; circle(input.ox,input.oy,48); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.18)'; circle(input.ox+kx,input.oy+ky,20); ctx.fill();
  }
  if(S.mode==='play'&&!p.moved&&t<10){
    ctx.globalAlpha=0.6+0.3*Math.sin(now*4);
    ctx.fillStyle='#ece8f5'; ctx.textAlign='center'; ctx.font=`700 15px ${SERIF}`;
    ctx.fillText('按住螢幕任意處，拖曳來移動',W/2,H*0.7);
    ctx.globalAlpha=1;
  }
}

/* ---------- 迴圈 ---------- */
let last=performance.now();
function frame(nowMs){
  let dt=(nowMs-last)/1000; last=nowMs;
  if(!(dt>0))dt=0; if(dt>0.05)dt=0.05;
  if(S&&S.mode==='play') update(dt);
  const mode=S?S.mode:'title';
  if(!S||mode==='play'||mode!==lastMode) render(nowMs/1000);
  lastMode=mode;
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);

})();
</script>
</body>
