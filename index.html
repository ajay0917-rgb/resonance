<title>共鳴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0d0f1f; --panel:rgba(21,24,51,.96); --card:rgba(255,255,255,.04); --line:rgba(190,180,255,.16);
  --ink:#ece8f5; --muted:#8e8aa8; --gold:#f2c46d;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ground:#0d0f1f; --panel:rgba(21,24,51,.96); --ink:#ece8f5; --muted:#8e8aa8; }
}
:root[data-theme="dark"]{ --ground:#0d0f1f; --panel:rgba(21,24,51,.96); --ink:#ece8f5; --muted:#8e8aa8; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ground)}
body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov,#ov button,#hud button{touch-action:manipulation}
/* 舊版 iOS（16.2 以前）不支援 color-mix，改用實色邊框 */
.nocm .slot,.nocm .pslot,.nocm .card,.nocm .badge,.nocm #resRow span,.nocm .foe i,.nocm #bossBar{border-color:var(--c,#666)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:10px 12px 8px;display:flex;flex-direction:column}
#hud.hidden{display:none}
.top{display:flex;align-items:center;gap:10px}
.hp{flex:1;max-width:210px;height:16px;border-radius:9px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.hp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#e8365e,#ff7d96);transition:width .12s}
.hp span{position:absolute;inset:0;font-size:10px;line-height:15px;text-align:center;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.clock{margin-left:auto;text-align:right;line-height:1}
#timer{font-family:var(--serif);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(13,15,31,.7);color:var(--ink);font-size:12px;letter-spacing:-2px;cursor:pointer}
#pauseBtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.xp{height:4px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46f0b4,#6cc8ff);transition:width .1s}
.meta{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
#bottom{margin-top:auto}
#burstBtn{position:absolute;right:12px;bottom:38px;width:56px;height:56px;border-radius:50%;padding:0;pointer-events:auto;border:2px solid rgba(242,196,109,.3);background:conic-gradient(rgba(242,196,109,.75) var(--p,0%),rgba(13,15,31,.72) 0);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#burstBtn span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(13,15,31,.92);color:rgba(242,196,109,.55);font:900 18px var(--serif)}
#burstBtn.ready{border-color:#f2c46d;animation:glow 0.9s ease-in-out infinite alternate}
#burstBtn.ready span{color:#f2c46d}
@keyframes glow{from{box-shadow:0 0 6px rgba(242,196,109,.4)}to{box-shadow:0 0 22px rgba(242,196,109,.9)}}
#wxTxt{margin-left:auto;font-weight:800}
.duo{font-size:15px!important;letter-spacing:-1px;display:flex!important;align-items:center;justify-content:center}
.badge.duo{font-size:19px!important}
.badge.rl{border-radius:50% 50% 12px 12px;border-color:#f2c46d}
.badge.pact{border-style:dashed}
#slots{display:flex;gap:6px;justify-content:center}
#resRow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:6px;min-height:0}
#resRow span{font-size:10px;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--c);background:rgba(13,15,31,.66);font-weight:700}
.prog{display:grid;grid-template-columns:4.6em 1fr 4.4em;align-items:center;gap:8px;font-size:12px;margin-top:7px}
.prog .nm{color:var(--c);font-weight:800}
.prog .tr{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--c)}
.prog .st{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .st.ok{color:var(--c);font-weight:700}
.rres{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}
.rres b{color:var(--c)}
.badge.res{border-style:double;border-width:3px}
.badge.pv,.sk .badge.pv{border-radius:50%}
.hp b{position:absolute;left:0;bottom:0;height:4px;width:0;background:#bfeaff;box-shadow:0 0 6px #bfeaff}
#pslots{display:flex;gap:6px;justify-content:center;margin-top:5px}
.pslot{width:30px;height:30px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c,#666) 45%,transparent);background:rgba(13,15,31,.62);display:grid;place-items:center;position:relative;font-family:var(--serif);font-weight:900;font-size:13px;color:var(--c,#555);padding-bottom:4px}
.pslot.empty{border:1px dashed rgba(255,255,255,.12)}
.pslot .pips{bottom:4px;gap:2px}
.pslot .pips b{width:4px;height:2px}
.slot{width:40px;height:42px;border-radius:11px;border:1px solid color-mix(in srgb,var(--c,#666) 40%,transparent);background:rgba(13,15,31,.62);display:grid;place-items:center;position:relative;font-family:var(--serif);font-weight:900;font-size:18px;color:var(--c,#555);padding-bottom:5px}
.slot.empty{border:1px dashed rgba(255,255,255,.14)}
.pips{position:absolute;bottom:5px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.pips b{width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
.pips b.on{background:var(--c)}
.cgrp{margin:14px 0 2px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.slot .pips{gap:2px}.slot .pips b{width:5px}
.slot .pips b.q.on{background:#f2c46d;box-shadow:0 0 4px #f2c46d}
#bossBar{margin-top:8px;padding:6px 9px 7px;border-radius:10px;background:rgba(13,15,31,.74);border:1px solid color-mix(in srgb,var(--c,#fff) 45%,transparent)}
#bossBar.hidden{display:none}
#bossBar .bh{display:flex;align-items:baseline;gap:8px}
#bossBar strong{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--c)}
#bossBar .bt{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink);text-align:right}
#bossBar .bb{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
#bossBar .bb i{display:block;height:100%;width:100%;background:var(--c);transition:width .1s}
.nick{display:flex;align-items:center;gap:10px;margin:14px 0 2px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left}
.nick span{font-size:13px;color:var(--muted);flex:none}
.nick input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:700 16px var(--sans);-webkit-user-select:text;user-select:text}
.nick input::placeholder{color:var(--muted);font-weight:400}
.nick:focus-within{border-color:var(--gold)}
.lb{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line)}
.lb .rk{font-family:var(--serif);font-weight:900;font-size:18px;color:var(--muted);text-align:center}
.lb.top .rk{color:var(--gold)}
.lb .who{min-width:0;font-weight:800;font-size:15px;overflow-wrap:anywhere}
.lb .who small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.lb .tm{font-family:var(--serif);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.lb.me{background:rgba(242,196,109,.08);border-radius:10px}
.lb .you{font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px;font-weight:700}
textarea.code,textarea.imp{display:block;width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:12px ui-monospace,Menlo,Consolas,monospace;padding:10px;resize:vertical;-webkit-user-select:text;user-select:text;word-break:break-all}
textarea.code{height:64px;margin-top:8px}
textarea.imp{height:92px}
.msg{font-size:12px;color:var(--gold);min-height:1.4em;margin:6px 0 0;text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.tab{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:800 15px var(--sans);cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold);background:rgba(242,196,109,.08)}
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode2 .btn{margin-top:10px}
.mode2 .btn small{display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:2px}
.foe{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.foe i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:3px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 25%,transparent)}
.foe b{color:var(--c);font-weight:800;font-size:14px}
.foe span{display:block;font-size:13px;color:#cfcbe0;line-height:1.55;margin-top:1px}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(22px,7vw,34px);pointer-events:none;opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.8)}
#banner.show{animation:bn 1.9s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translateY(8px) scale(.96)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* Overlay */

.cb{flex:1;min-width:0}
.ct{font-weight:800;font-size:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

.note{font-size:13px;color:#cfcbe0;text-align:center;margin:6px 0 0;line-height:1.6}
@media (prefers-reduced-motion:reduce){#banner.show{animation-duration:2.4s}.hp i,.xp i{transition:none}}

/* ===== HUD 美化 ===== */

.slot::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--c,#666) 26%,transparent),transparent 70%);pointer-events:none}

.slot.duo.tri{font-size:11px;letter-spacing:-1.5px}
.slot .fzm{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#ffe29a,#d9a441);color:#2a1c05;font-style:normal;font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 8px rgba(242,196,109,.7);font-family:var(--serif)}

.pslot{width:32px;height:32px;border:none;background:linear-gradient(180deg,rgba(30,34,62,.85),rgba(11,13,26,.85));box-shadow:0 0 0 1px color-mix(in srgb,var(--c,#666) 40%,transparent),0 4px 10px rgba(0,0,0,.3)}
.pslot.empty{background:rgba(255,255,255,.02);box-shadow:none;border:1px dashed rgba(255,255,255,.12)}
.badge.duo.tri{font-size:13px;letter-spacing:-1px}
.card.fzcard{border:1.5px solid transparent;background:linear-gradient(180deg,rgba(30,28,20,.96),rgba(14,15,30,.96)) padding-box,linear-gradient(135deg,var(--c),#f2c46d,var(--c2)) border-box}
/* ===== 暫停畫面 ===== */

.pzd .bd{flex:0 0 32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:15px;color:var(--c);background:rgba(11,13,26,.8);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent);letter-spacing:-1px;overflow:hidden}

.pzd[open] .chev{transform:rotate(-135deg) translateY(-1px)}

.pzboss{margin-top:12px;padding:12px 13px;border-radius:14px;text-align:left;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.pzbn{font-family:var(--serif);font-weight:900;font-size:17px;color:var(--c)}

/* ===== 升級卡牌 ===== */
.pcards{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin:18px 0 8px;align-items:end}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:214px;padding:11px 7px 10px;border-radius:15px;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);
  background:radial-gradient(120% 65% at 50% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 62%),linear-gradient(180deg,#1b1e3a,#0b0c1b);color:#eeedf8;font:inherit;text-align:center;cursor:pointer;overflow:hidden;
  transform:rotate(var(--r)) translateY(var(--y));transition:transform .2s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s,opacity .2s;box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.09)}
.pcard::before{content:'';position:absolute;inset:4px;border-radius:11px;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.pcard::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 48%,transparent 60%);transform:translateX(-130%);pointer-events:none}
.pcard.on::after{animation:pcshine 1s ease-out}
@keyframes pcshine{to{transform:translateX(130%)}}
.pcards.anim .pcard{animation:pcin .45s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:var(--d)}
@keyframes pcin{from{opacity:0;transform:translateY(46px) rotate(0) scale(.88)}}
.pcard.on{transform:translateY(-12px) scale(1.05);z-index:2;box-shadow:0 0 0 1.5px var(--c),0 0 28px color-mix(in srgb,var(--c) 55%,transparent),0 16px 30px rgba(0,0,0,.5)}
.pcard.dim{opacity:.6}
.pcard:active{filter:brightness(1.15)}
.pc-kind{font-size:9.5px;font-weight:800;letter-spacing:.2em;color:color-mix(in srgb,var(--c) 70%,#fff)}
.pc-badge{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:28px;color:var(--c);margin:3px 0 2px;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 32%,#0b0c1a),#0b0c1a 72%);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent),0 0 20px color-mix(in srgb,var(--c) 38%,transparent)}
.pc-badge.duo{font-size:18px;letter-spacing:-1px}.pc-badge.duo.tri{font-size:13px}
.pc-badge.rl{border-radius:50% 50% 14px 14px}.pc-badge.pv{border-radius:16px}
.pc-name{font-weight:900;font-size:14px;line-height:1.25;word-break:break-all}
.pc-tag{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 78%,#fff)}
.pc-sum{font-size:10.5px;line-height:1.45;color:#b8bad2;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.pc-els{display:flex;gap:4px;margin-top:auto;padding-top:5px}.pc-els i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 6px currentColor}
.pcard.sk.new .pc-kind::before{content:'✦ '}
.pcard.rl{border-color:#f2c46d;background:radial-gradient(120% 65% at 50% 0%,rgba(242,196,109,.28),transparent 62%),linear-gradient(180deg,#22203a,#0c0c1a)}
.pcard.rl::before{border-color:rgba(242,196,109,.25)}
.pcard.fz{border:1.5px solid transparent;background:radial-gradient(120% 65% at 50% 0%,rgba(242,196,109,.26),transparent 62%) padding-box,linear-gradient(180deg,#221f34,#0c0c1a) padding-box,linear-gradient(160deg,var(--c),#f2c46d,var(--c)) border-box}
.pcard.res::before{border:1px double color-mix(in srgb,var(--c) 40%,transparent);inset:3px}
.pcard.ct,.pcard.mu{border-style:dashed}
.pcards.n4 .pcard{min-height:200px;padding:10px 5px}.pcards.n4 .pc-badge{width:46px;height:46px;font-size:23px}.pcards.n4 .pc-name{font-size:12.5px}.pcards.n4 .pc-sum{font-size:10px;-webkit-line-clamp:4}
.pdetail{margin-top:6px;animation:pdin .22s ease-out}
@keyframes pdin{from{opacity:0;transform:translateY(10px)}}
.pconfirm{margin-top:10px}
.pc-info{position:absolute;top:5px;right:5px;z-index:3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:italic 800 13px var(--serif);color:color-mix(in srgb,var(--c) 80%,#fff);background:rgba(8,9,20,.65);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.pc-info::before{content:'';position:absolute;inset:-8px}
.pc-i-demo{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font:italic 800 11px var(--serif);color:var(--gold);box-shadow:0 0 0 1px rgba(242,196,109,.5);vertical-align:1px}
.phint{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 4px}

/* ===== 主頁面 ===== */

<body>

const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  shatter:{n:'碎裂',c:'#e9fbff',pair:['phys','frozen'],d:'物理攻擊打中凍結的敵人，造成巨額傷害。'},

const PE={ember:'burn',surge:'wet',frost:'chill',arc:'shock',oil:'oil',blades:'phys',lance:'chill',gale:'wind',rock:'geo',
  frain:'burn',wblade:'wet',jail:'wet',iwall:'chill',spear:'shock',cloud:'shock',mist:'oil',knives:'phys',hammer:'phys',wcut:'wind',spike:'geo',vine:'wood',spore:'wood',sword:'metal',sand:'metal'};
const hexA=(h,a)=>{ const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
function cyc(s,e){ if(!s.cy||s.cy.size>600) s.cy=new Map(); const k=(s.cy.get(e)||0); s.cy.set(e,k+1); return k; }
function hasEl(e){ return ANY5.some(k=>e.st[k]>0); }
function isBurn(e){ return e.st.burn>0; } function isWet(e){ return e.st.wet>0; } function isOily(e){ return e.st.oil>0; }
function isCold(e){ return e.st.frozen>0||e.st.vuln>0; } function isVuln(e){ return e.st.vuln>0; }
function gz(x,y,el,r,l,src){ if(S.Z.length<250) S.Z.push({k:'gz',x,y,r,l,m:l,el,src}); }
/* 命中模組：els 附加狀態（alt＝每次只附加一種、輪流）、phys 物理、kb 擊退（負數＝拉近）、stun 暈眩、vuln 易傷、slow 額外減速、
   wk 削弱攻擊、ext 延長其他狀態、gz 留下元素地面、jump 跳到附近敵人、gel 油膩直接凍結、vs/vx 對特定狀態加倍、pre/on 特殊效果 */
function eHit(e,dmg,m,src,ox,oy,s){
  if(e.dead) return;
  if(m.gel&&e.st.oil>0&&!(e.st.frozen>0)&&(e.rc.freeze||0)<=S.t){ e.st.oil=0; react('freeze',e,0); hit(e,dmg,src,m.phys); return; }
  if(m.pre){ m.pre(e,s); if(e.dead) return; }
  hit(e,m.vs&&m.vs(e)?dmg*(m.vx||2):dmg,src,m.phys);
  if(e.dead) return;
  const els=m.els, bd=(m.bd||3)*dMult();
  if(els&&els.length){
    if(m.alt) applyStatus(e,els[cyc(s,e)%els.length],m.sd||3,src,bd);
    else for(const x of els){ if(e.dead) break; applyStatus(e,x,m.sd||3,src,bd); }
  }
  if(e.dead) return;
  if(m.kb) knock(e,ox,oy,m.kb);
  if(m.stun) e.stun=Math.max(e.stun||0,m.stun*(e.boss?0.15:e.elite?0.4:1));
  if(m.vuln) e.st.vuln=Math.max(e.st.vuln,m.vuln);
  if(m.slow){ e.slw=S.t+m.slow; e.slwF=m.slowF||0.5; }
  if(m.wk) e.wk=S.t+m.wk;
  if(m.ext) for(const k of ANY5) if(k!=='oil'&&e.st[k]>0) e.st[k]+=m.ext;
  if(m.gz&&!((s.gzT||0)>S.t)){ s.gzT=S.t+(m.gz.gap||0.3); gz(e.x,e.y,m.gz.el,m.gz.r,m.gz.l,src); }
  if(m.jump){ const J=m.jump;
    for(const o of nearestN(e.x,e.y,6,J.rr||120,e).filter(o=>!J.need||o.st[J.need]>0).slice(0,J.n||2)){
      fxBolt(e.x,e.y,o.x,o.y,COL[J.el]||'#ffffff',0.18); hit(o,dmg*(J.f||0.5),src,m.phys); if(!o.dead) applyStatus(o,J.el,3,src,bd); } }
  if(m.on) m.on(e,s);
}

/* ===== 元素融合 v4 =====
   兩種元素都有 Lv5（質變）技能 → 升級時可以解鎖這一組「融合」（類似 Hades 的雙神祝福）。
   解鎖後，兩種元素在同一個敵人身上相遇就觸發：先在敵人身上的叫「底」，後到的叫「觸發」，順序不同效果不同
   （類似原神反應有正反向）。原本的技能、反應照常運作，融合只多一個簡單、看得懂的效果。
   風、岩、物理不會留在敵人身上，所以打中後 1.2 秒內算「在先」。 */
const EL_N={burn:'火',wet:'水',chill:'冰',shock:'雷',oil:'油',phys:'物理',wind:'風',geo:'岩',wood:'木',metal:'金'};
const FZ_ELS=['burn','wet','chill','shock','oil','phys','wind','geo','wood','metal'];
const fzLabel=k=>k.split('|').map(x=>EL_N[x]).join('×');
function pres(e,x){ return ANY5.includes(x)?e.st[x]>0:!!(e.tc&&e.tc[x]>S.t-1.2); }
function dirPt(x,y,a,d){ return {x:x+Math.cos(a)*d,y:y+Math.sin(a)*d}; }
/* ---- 融合效果的五種積木：爆、碎片、地面、連鎖、直線／扇形 ---- */
function fzB(x,y,r,dmg,o){ o=o||{}; fxBoom(x,y,r,o.c||'#ffffff'); fxRing(x,y,r+12,o.c2||o.c||'#ffffff',0.4);
  for(const e of query(x,y,r)){ if(e.dead) continue; hit(e,dmg*dMult(),'fusion',o.p); if(e.dead) continue;
    if(o.el) applyStatus(e,o.el,3,'fusion',3*dMult()); if(e.dead) continue;
    if(o.kb) knock(e,x,y,o.kb); if(o.st) e.stun=Math.max(e.stun||0,o.st*(e.boss?0.15:e.elite?0.4:1));
    if(o.v) e.st.vuln=Math.max(e.st.vuln,o.v); if(o.sl){ e.slw=S.t+o.sl; e.slwF=o.slF||0.5; } } }
function fzSh(x,y,n,dmg,o){ o=o||{}; const a0=rand(0,TAU);
  for(let i=0;i<n;i++){ const a=a0+i*TAU/n; S.P.push({k:'xs',id:'fusion',x,y,vx:Math.cos(a)*380,vy:Math.sin(a)*380,v:380,l:0.6,pr:o.pr||1,r:8*SKHB,sz:4*SKSZ,dmg:dmg*dMult(),hs:new Set(),
    m:{phys:o.p,els:o.el?[o.el]:null,slow:o.sl,slowF:0.5},c:o.c||'#ffffff',c2:o.c2||o.c||'#ffffff'}); } }
function fzZ(x,y,p){ if(S.Z.length>=250) return;
  S.Z.push({k:'xz',id:'fusion',x,y,r:p.r,l:p.l,m:p.l,tk:0.05,dmg:(p.dmg||0)*dMult(),
    mod:{els:p.els,alt:p.alt,phys:p.p,slow:p.sl,slowF:p.slF,stun:p.st,wk:p.wk,kb:p.kb,jump:p.jump},
    P:{tick:p.tick||0.5,cap:p.cap||14,pull:p.pull,mv:p.mv,drop:p.drop,rand:p.rand,bolt:p.bolt},c:p.c,c2:p.c2,st:{}}); }
function fzCh(x,y,n,dmg,el,pref,rr){ const hs=new Set(); let px=x, py=y, d=dmg*dMult();
  const pk=a=>{ if(pref){ const f=a.filter(pref); if(f.length) a=f; } return a.length?a[(Math.random()*a.length)|0]:null; };
  let cur=pk(query(x,y,rr||140));
  for(let i=0;i<n&&cur;i++){ fxBolt(px,py,cur.x,cur.y,COL[el],0.22); hs.add(cur); hit(cur,d,'fusion'); if(!cur.dead) applyStatus(cur,el,3,'fusion');
    px=cur.x; py=cur.y; d*=0.9; cur=pk(query(px,py,rr||140).filter(o=>!hs.has(o))); } }
function fzLn(x,y,a,len,dmg,o){ xLine('fusion',{},x,y,a,len,o.w||14,dmg*dMult(),{phys:o.p,els:o.el?[o.el]:null,kb:o.kb,slow:o.sl,slowF:0.5},o.c||'#ffffff'); }
function fzCn(x,y,a,len,ang,dmg,o){ fx({k:'cone',x,y,a,len,ang,c:o.c,l:0.3,m:0.3});
  for(const e of query(x,y,len)){ let da=Math.atan2(e.y-y,e.x-x)-a; da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)<=ang/2) eHit(e,dmg*dMult(),{phys:o.p,kb:o.kb},'fusion',x,y,{}); } }
function fzAp(x,y,r,el,o){ fxRing(x,y,r,COL[el],0.45); for(const e of query(x,y,r)){ applyStatus(e,el,3,'fusion'); if(o&&o.sl&&!e.dead){ e.slw=S.t+o.sl; e.slwF=0.5; } } }
const C=COL;
const fzA=(x,y)=>Math.atan2(y-S.p.y,x-S.p.x);   // 融合方向：從你指向命中點
function fzMag(x,y,R,root){ for(const o of query(x,y,R)) if(!o.dead&&!o.boss&&o.st.metal>0){ knock(o,x,y,-Math.min(480,Math.sqrt(dd(o.x,o.y,x,y))*3)); fxBolt(o.x,o.y,x,y,'#b8c7ff',0.18); if(root){ o.slw=S.t+root; o.slwF=0.05; o.rtT=S.t+root; } } }
function fzCry(x,y,el){ let n=0; for(const g of S.G) if(g.k==='cry') n++; if(n<8) S.G.push({k:'cry',x:x+rand(-8,8),y:y+rand(-8,8),el,l:9,m:false,s:0}); }
function fzHeal(n){ S.p.hp=Math.min(S.p.max,S.p.hp+n); txt(S.p.x,S.p.y-S.p.r-14,'+'+n,'#7ed957',0.85); }
function fzShred(x,y,R,f,fb){ for(const o of query(x,y,R)) if(!o.dead&&o.sh>0){ o.sh-=o.shMax*(o.boss?fb:f); if(o.sh<=0) o.sh=0.01; hit(o,1,'rust'); } }

/* 元素碰到敵人時檢查融合：每次最多觸發一個；同方向冷卻 1.5 秒、三元素 3.5 秒；全畫面每秒最多 4 次，避免後期洗版 */
function fuseTouch(e,el){
  const U=S.fu; if(!U) return; const t=S.t;
  S.fcd=S.fcd||{};
  // 三元素：三種元素在 2 秒內都打中同一個敵人（反應會吃掉狀態，所以看 2 秒內有沒有碰過）
  for(const k in S.fu3||{}){ const es=k.split('|'); if(!es.includes(el)||(S.fcd[k]||0)>t) continue;
    if(es.every(x=>x===el||pres(e,x)||(e.tc&&e.tc[x]>t-2))){ S.fcd[k]=t+3.5; fireFz(FZ3[k],e,'#f2c46d',1); return; } }
  // 兩元素：「底」必須還在敵人身上；全畫面每秒最多 4 次，後期不洗版
  if(t>(S.fzr||0)){ S.fzr=t+1; S.fzn=0; } if(S.fzn>=4) return;
  for(const x of FZ_ELS){ if(x===el||!pres(e,x)) continue; const k=[x,el].sort().join('|'); if(!U[k]) continue; const ck=k+'>'+x; if((S.fcd[ck]||0)>t) continue;
    S.fcd[ck]=t+1.5; fireFz(FZ[k][x],e,COL[el]); return; }
}
function fireFz(D,e,c,big){
  S.fzn=(S.fzn||0)+1; S.fzc=S.fzc||{}; S.fzc[D.n]=(S.fzc[D.n]||0)+1;
  const x=e.x, y=e.y, a=Math.atan2(y-S.p.y,x-S.p.x);
  D.f(e,x,y,a); txt(x,y-26,D.n,big?'#f2c46d':c,big?1.3:1.05);
  if(big){ fxRing(x,y,140,'#f2c46d',0.6); S.shake=Math.max(S.shake,0.12); sfx('res'); }
}
const FZ_MAX=5;
function fuseOpts(){
  const out=[], base=S.order.filter(id=>PE[id]&&!SK[id].hidden&&S.sk[id].lv>=SKMAX), U=S.fu||{}, U3=S.fu3||{}, seen=new Set();
  if(S.order.filter(id=>SK[id].fz).length<FZ_MAX)
    for(let i=0;i<base.length;i++) for(let j=i+1;j<base.length;j++){ const a=base[i], b=base[j], k=[PE[a],PE[b]].sort().join('|');
      if(PE[a]!==PE[b]&&FZ[k]&&!U[k]&&!seen.has(k)){ seen.add(k); out.push({fz:[a,b]}); } }
  for(const f of S.order){ const d=SK[f]; if(!d.fz||d.tri) continue; const es=d.key.split('|');
    for(const c of base){ const z=PE[c]; if(es.includes(z)) continue; const tk=[...es,z].sort().join('|'); if(FZ3[tk]&&!U3[tk]) out.push({fz3:[f,c,tk]}); } }
  return out;
}
function regFz(id,ps,key,tri){
  SK[id]={ch:ps.map(x=>SK[x].ch).join(''),n:tri?FZ3[key].n:ps.map(x=>SK[x].n).join('＋'),c:SK[ps[0]].c,c2:SK[ps[1]].c,c3:ps[2]?SK[ps[2]].c:null,
    ap:[...new Set(ps.flatMap(x=>SK[x].ap))],hidden:1,fused:1,fz:1,tri:!!tri,key,parts:ps,d:Array(SKMAX).fill('')};
}
function doFuse(a,b){
  const k=[PE[a],PE[b]].sort().join('|'), id='fz_'+a+'_'+b; regFz(id,[a,b],k);
  S.order=S.order.filter(x=>x!==b); S.order[S.order.indexOf(a)]=id;
  S.sk[a].in=id; S.sk[b].in=id; S.sk[id]={lv:SKMAX,parts:[a,b],id};
  (S.fu||(S.fu={}))[k]=1;
  banner('融合：'+SK[a].n+'＋'+SK[b].n,'#f2c46d'); sfx('res'); fxRing(S.p.x,S.p.y,130,SK[a].c,0.5); fxRing(S.p.x,S.p.y,90,SK[b].c,0.4);
}
function doTri(f,c,tk){
  const ps=[...S.sk[f].parts,c], id='tz_'+ps.join('_'); regFz(id,ps,tk,1);
  S.order=S.order.filter(x=>x!==c); S.order[S.order.indexOf(f)]=id;
  delete S.sk[f]; for(const x of ps) S.sk[x].in=id; S.sk[id]={lv:SKMAX,parts:ps,id};
  S.fu=S.fu||{}; for(const x of ps.slice(0,2)) S.fu[[PE[x],PE[c]].sort().join('|')]=1;
  (S.fu3||(S.fu3={}))[tk]=1;
  banner('三元素融合：'+FZ3[tk].n,'#f2c46d'); sfx('res'); for(let i=0;i<3;i++) fxRing(S.p.x,S.p.y,90+i*45,[SK[ps[0]].c,SK[ps[1]].c,SK[c].c][i],0.5+i*0.1);
}

function pickType(t){

  if(t>90) w.push(['brute',0.06+t/2500]);
  if(t>110) w.push(['splitter',0.07]);

  for(const k of S.unl) w.push([k,k==='shaman'?0.035*(1+2*(S.mu.warded||0)):0.09]);
  let sum=0; for(const x of w) sum+=x[1];
  let r=Math.random()*sum; for(const [k,x] of w){ r-=x; if(r<=0) return k; }
  return 'crawler';
}
/* ===== 無盡模式時間軸 =====
   0:00–4:00  與標準模式相同的開場，4:00 第一隻強敵
   討伐強敵 → 清場（金色震波掃過全場，非強敵全部消散，經驗凝成一顆）→ 喘息 10 秒（不生成）
   → 下一層（詛咒、新敵人、換景）→ 層內 120 秒：0–30 蓄勢｜30 屍潮｜75 菁英｜110 預告｜120 強敵（帶著烙印）

const LT={horde:30,elite:75,boss:120,rest:10};
function surgeHorde(k){ const pool=['crawler','runner','bubble','splitter','husk','brute','cleanser',...S.unl], ty=pool[(S.layer*3+S.bsN)%pool.length];

function surgeElite(n){ spawnElites((n||Math.min(4,1+Math.ceil(S.layer/2)))+(S.mu.elite||0)); }
function nextLayer(){
  S.layer++; S.pal=(S.layer-1)%LAYERS.length; S.newE=S.layer<=NEWT.length?NEWT[S.layer-1]:null;
  if(S.newE){ S.unl.push(S.newE); ringSpawn(S.newE,10); }

function startSweep(x,y){ S.lp='sweep'; S.lt=0; S.sw={x,y,r:0,max:spawnDist()*1.5,xp:0,n:0}; S.H=[]; banner('討伐！深淵退潮','#f2c46d'); }
function updSweep(dt){
  const w=S.sw; if(!w){ S.lp='rest'; S.lt=0; return; }
  w.r+=dt*1100; const r2=w.r*w.r;
  for(const e of S.E){ if(e.dead||e.boss) continue;
    if(dd(e.x,e.y,w.x,w.y)<r2){ e.dead=true; S.kills++; w.xp+=e.xp||0; if((w.n++)%5===0) burst(e.x,e.y,'#ffe48a',2,70,1.5); } }
  if(w.r>=w.max){
    for(const e of S.E) if(!e.dead&&!e.boss){ e.dead=true; S.kills++; w.xp+=e.xp||0; w.n++; }   // 視野外的也一起退
    if(w.xp>0) S.G.push({x:w.x,y:w.y,v:Math.max(1,Math.round(w.xp*0.6)),m:false,s:0});
    if(w.n) txt(S.p.x,S.p.y-40,'清場 ×'+w.n,'#ffe48a',1.3);

}
function endlessFlow(dt){
  S.lt+=dt;
  if(S.lp==='pre'||S.lp==='wave'){
    const ref=S.lp==='pre'?S.t:S.lt, tb=S.lp==='pre'?240:LT.boss;
    if(S.lp==='wave'){ if(!S.lw1&&S.lt>=LT.horde){ S.lw1=1; surgeHorde(); } if(!S.lw2&&S.lt>=LT.elite){ S.lw2=1; surgeElite(); } }
    if(!S.warned&&ref>=tb-10){ S.warned=1; S.bossK=S.bossQ[S.bossN%S.bossQ.length]; const ni=impCount();
      banner('強敵接近：'+BOSS[S.bossK].n+(ni?'（深淵烙印 ×'+ni+'）':''),BOSS[S.bossK].c); sfx('warn'); }
    if(ref>=tb&&(!S.boss||S.boss.dead)){ spawnBoss(); S.warned=0; S.lp='boss'; S.lt=0; S.bsT=35; }
  } else if(S.lp==='boss'){
    if(!S.boss||S.boss.dead){ startSweep(S.p.x,S.p.y); return; }   // 保險：強敵不見了也要能往下走
    S.bsT-=dt; if(S.bsT<=0){ S.bsT=35; (S.bsN++%2)?surgeElite(Math.min(3,1+(S.layer>>2))):surgeHorde(0.6); }
  } else if(S.lp==='sweep') updSweep(dt);
  else if(S.lp==='rest'&&S.lt>=LT.rest) nextLayer();
}
function spawn(dt){
  const t=S.t, ef=S.endless;
  if(ef) endlessFlow(dt);
  const calm=ef&&(S.lp==='sweep'||S.lp==='rest'), late=ef&&t>=300;   // 清場與喘息：完全不生成
  if(!calm&&S.E.length<(late?200:300)){
    const rate=Math.min(spawnRate(t),late?8:999);   // 無盡後期生成率上限 8/s
    S.sa+=rate*(S.boss&&!S.boss.dead?0.6:1)*1.25**(S.ct.swarm||0)*dt;
    while(S.sa>=1){ S.sa-=1; spawnEnemy(pickType(t)); }
  }
  if(!calm) for(const [et,fn] of EVENTS){ if(!S.ev[et]&&t>=et){ S.ev[et]=1; fn(); } }
  if(!ef&&(!S.boss||S.boss.dead)){
    if(!S.warned&&t>=S.nextBoss-10){ S.warned=1; banner('強敵接近：'+BOSS[S.bossK].n,BOSS[S.bossK].c); sfx('warn'); }
    if(t>=S.nextBoss){ spawnBoss(); S.warned=0; S.nextBoss=1e9; }
  }
  if(S.mu.swarm&&!calm){ S.swT-=dt; if(S.swT<=0){ S.swT=Math.max(8,20/S.mu.swarm); ringSpawn('mite',14+4*S.mu.swarm); } }
}

      return null;

function updHaz(dt){
  const p=S.p;
  for(const h of S.H){
    h.l-=dt;
    if(h.k==='shot'){ h.x+=h.vx*dt; h.y+=h.vy*dt; if(dd(h.x,h.y,p.x,p.y)<(h.r+p.r)**2){ hzHit(h); h.l=0; } }
    else if(h.k==='ring'){ h.rad+=h.spd*dt; if(h.rad>=h.max) h.l=0;
      else if(!h.hit&&Math.abs(Math.sqrt(dd(h.x,h.y,p.x,p.y))-h.rad)<h.w+p.r){ h.hit=1; hzHit(h); } }
    else if(h.k==='mark'){ h.t+=dt; if(h.follow&&!h.follow.dead){ h.x=h.follow.x; h.y=h.follow.y; }
      if(h.pull) for(const o of query(h.x,h.y,h.r)) if(!o.dead&&!o.boss){ const dx=h.x-o.x, dy=h.y-o.y, d=Math.hypot(dx,dy)||1; if(d>20){ o.x+=dx/d*h.pull*dt; o.y+=dy/d*h.pull*dt; } }   // 漩渦：把敵人吸過去
      if(h.t>=h.dur&&!h.done){ h.done=1; h.l=0; if(h.dmg>0){ fxBoom(h.x,h.y,h.r,`rgb(${h.c})`); if(dd(h.x,h.y,p.x,p.y)<(h.r+p.r)**2) hzHit(h); } } }
    else if(h.k==='pool'){ if(dd(h.x,h.y,p.x,p.y)<(h.r+p.r*0.4)**2) hzHit(h); }
  }
  S.H=S.H.filter(h=>h.l>0);
}

/* ---------- 投射物、區域 ---------- */
function updProj(dt){
  const p=S.p;
  for(const o of S.P){
    if(o.k==='bolt'){
      if(o.tg&&!o.tg.dead){
        const a=Math.atan2(o.tg.y-o.y,o.tg.x-o.x), cur=Math.atan2(o.vy,o.vx);
        let da=a-cur; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
        const na=cur+clamp(da,-7*dt,7*dt); o.vx=Math.cos(na)*360; o.vy=Math.sin(na)*360;
      }
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.l-=dt;
      const hs=query(o.x,o.y,o.hr||5);
      if(hs.length){ const e=hs[0]; hit(e,o.dmg,'ember'); if(!o.mini) brEmber(e,o); if(!e.dead){ applyStatus(e,'burn',o.bdur||3,'ember',o.bd); if(o.seed&&e.st.burn>0&&e.aura!=='burn') e.seed=Math.max(e.seed||0,o.seed); } o.l=0; burst(o.x,o.y,COL.burn,4,80,2); }
      else if(Math.random()<0.5) fx({k:'pt',x:o.x,y:o.y,vx:0,vy:0,c:COL.burn,l:.2,m:.2,s:2.5});
    } else if(o.k==='lance'){
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.l-=dt;
      for(const e of query(o.x,o.y,o.hr||6)){
        if(o.hs.has(e))continue; o.hs.add(e); brLance(e,o);
        const wasF=o.thru&&e.st.frozen>0;   // Lv5 穿冰：打碎凍結的敵人不算貫穿
        hit(e,o.dmg,'lance',true); if(!e.dead) applyStatus(e,'chill',2,'lance');
        if(!wasF&&--o.pc<=0){o.l=0;break}
      }
    } else if(o.k==='flask'){
      o.t+=dt;
      if(o.t>=o.dur){ o.l=0; const pl=o.pl||5; S.Z.push({k:'oil',x:o.tx,y:o.ty,r:o.r,l:pl,m:pl,od:o.od||0.5,gr:brv('oil','grow')}); burst(o.tx,o.ty,COL.oil,10,140,3); brOilLand(o); }
    } else if(o.k==='xs'||o.k==='xk'||o.k==='xn'){ updX(o,dt);
    } else if(o.k==='gale'){
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.l-=dt; if(o.l<=0) brGaleEnd(o);
      for(const e of query(o.x,o.y,o.r)){
        const w=e.elite?0.25:0.8; e.x+=o.vx*dt*w; e.y+=o.vy*dt*w;
        const nw=!o.hs.has(e); if((o.hs.get(e)||0)>S.t) continue; o.hs.set(e,S.t+0.8);
        if(nw&&o.en&&!o.mini) o.l=Math.min(o.l+(o.en>1?0.25:0.12),(o.l0||3)+2);   // 分支：龍捲延續
        hit(e,o.dmg,'gale'); if(e.dead) continue;
        if(o.bear){   // Lv5 挾帶：記住第一個擴散出去的狀態，之後沿途附加
          if(o.carry&&!(e.st[o.carry]>0)) applyStatus(e,o.carry,3,'gale',2*dMult());
          else if(!o.carry&&(e.rc.swirl||0)<=S.t){ const x=ANY5.find(k=>e.st[k]>0); if(x) o.carry=x; }
          if(e.dead) continue;
        }
        applyStatus(e,'wind',0,'gale');
      }
    } else if(o.k==='rock'){
      o.t+=dt;
      if(o.t>=o.dur){
        o.l=0; fxBoom(o.x,o.y,o.r,COL.geo); burst(o.x,o.y,'#f3d39a',10,160,3); S.shake=Math.max(S.shake,0.08); sfx('rock'); brRockLand(o);
        const rs=S.sk.rock, canAb=o.absorb&&!o.el&&rs;
        for(const e of query(o.x,o.y,o.r)){ hit(e,o.dmg,'rock',true); if(!e.dead){
          // Lv5 元素岩：吸收結晶的元素（落石自己帶出去的元素不算，避免自己餵自己）
          if(canAb&&!o.got&&!(e.rkT>S.t)&&(e.rc.crystal||0)<=S.t){ const x=ELE4.find(k=>e.st[k]>0); if(x) o.got=x; }
          applyStatus(e,'geo',0,'rock');
          if(o.el&&!e.dead){ applyStatus(e,o.el,2.5,'rock',3*dMult()); e.rkT=S.t+2.5*(1+0.25*pvl('echo'))+0.2; }
          if(!e.dead) knock(e,o.x,o.y,70); } }
        if(o.el) fxRing(o.x,o.y,o.r+10,COL[o.el],0.4);
        if(o.got&&rs&&!rs.el) rs.el=o.got;
      }
    } else if(o.k==='wave'){
      o.t+=dt; const k=Math.min(1,o.t/o.dur); o.rad=o.max*(1-(1-k)*(1-k));
      for(const e of query(p.x,p.y,o.rad)){
        if(o.hs.has(e))continue; o.hs.add(e);
        hit(e,o.dmg,'surge'); if(!e.dead){ knock(e,p.x,p.y,110); applyStatus(e,'wet',o.wd||4,'surge'); }
      }
      if(o.ebb&&!o.eb&&o.t>=o.dur+0.12){   // Lv5 退潮：收回到 62% 半徑，把外圈敵人拉回來擠成一圈
        o.eb=1; const R0=o.max*0.62;
        S.P.push({k:'ebb',t:0,dur:0.3,from:o.max,to:R0,rad:o.max,l:1});
        for(const e of query(p.x,p.y,o.max+30)){ const d=Math.sqrt(dd(e.x,e.y,p.x,p.y)); if(d<=R0) continue;
          knock(e,p.x,p.y,-Math.min(420,7*(d-R0))); if(!e.dead) applyStatus(e,'wet',o.wd||4,'surge'); }
      }
      if(o.t>=o.dur+0.15&&(!o.ebb||o.eb))o.l=0;
    } else if(o.k==='ebb'){
      o.t+=dt; const k=Math.min(1,o.t/o.dur); o.rad=o.from+(o.to-o.from)*k*(2-k); if(o.t>=o.dur)o.l=0;
    }
  }
  S.P=S.P.filter(o=>o.l>0);
}
function updZones(dt){
  for(const z of S.Z){
    z.l-=dt;
    if(z.ch>S.t&&(z.cht=(z.cht||0)-dt)<=0){ z.cht=0.5; for(const e of query(z.x,z.y,z.r)) applyStatus(e,'shock',2,'spear'); }   // 雷槍 Lv5 充能
    if(z.k==='xz'){ updXZ(z,dt); continue; }
    if(z.k==='gz'){ for(const e of query(z.x,z.y,z.r)) applyStatus(e,z.el,1.2,z.src||'weather',2*dMult()); continue; }
    if(z.k==='frost'){ for(const e of query(z.x,z.y,z.r)){
        if(z.cw&&(e.cwT||0)<=S.t){ e.cwT=S.t+1.2; for(const o of nearestN(e.x,e.y,1+z.cw,90,e)) applyStatus(o,'chill',2,'frost'); }   // 分支：寒潮
        if(z.gel&&e.st.oil>0&&!(e.st.frozen>0)&&(e.rc.freeze||0)<=S.t){ e.st.oil=0; react('freeze',e,0); continue; }   // Lv5 凝油
        applyStatus(e,'chill',z.cd||1.2,'frost'); } }
    else if(z.k==='oil'){ if(z.gr&&z.r<(z.r0||(z.r0=z.r))*(1.25+0.25*z.gr)) z.r+=(6+6*z.gr)*dt; for(const e of query(z.x,z.y,z.r)) applyStatus(e,'oil',z.od||0.5,'oil'); }
    else if(z.k==='well'&&z.col&&z.l<=0&&!z.done){ z.done=1; collapse(z); }
    else if(z.k==='steam'){ for(const e of query(z.x,z.y,z.r)) applyStatus(e,'wet',1.2,'vaporize'); }
    else if(z.k==='scorch'){ const bd=2*rMult(); for(const e of query(z.x,z.y,z.r)) applyStatus(e,'burn',1.5,'combust',bd); }
  }
  for(const z of S.Z) if(z.l<=0&&!z.ended){ const f=z.end||(z.P&&z.P.end); if(f){ z.ended=1; f(z); } }   // 分支：區域結束時
  S.Z=S.Z.filter(z=>z.l>0);
}

/* 引力核 Lv5 坍縮：井裡的敵人互相交換一種狀態 */
function collapse(z){
  const ts=query(z.x,z.y,z.r*0.7).filter(e=>!e.dead).slice(0,18); if(ts.length<2) return;
  const has=ts.map(e=>ANY5.filter(k=>e.st[k]>0));
  fxRing(z.x,z.y,z.r*0.7,'#b58cff',0.45); fxRing(z.x,z.y,30,'#f2c46d',0.35); sfx('swirl');
  const give=[];
  ts.forEach((e,i)=>{ const pool=[]; has.forEach((h,j)=>{ if(j!==i) for(const k of h) if(!(e.st[k]>0)) pool.push(k); }); if(pool.length) give.push([e,pool[(Math.random()*pool.length)|0]]); });
  later(0.06,()=>{ for(const [e,k] of give) if(!e.dead){ fxBolt(z.x,z.y,e.x,e.y,COL[k],0.15); applyStatus(e,k,3,'gravity',2*dMult()); } });
}

/* ---------- 敵人 ---------- */
function updEnemies(dt){
  const p=S.p, wells=S.Z.filter(z=>z.k==='well'), dec=Math.exp(-7*dt), far=spawnDist()*1.45;
  for(const e of S.E){
    if(e.dead)continue;
    const s=e.st;
    const hold=e.hold>S.t;   // 領域 Lv5 凝滯
    if(s.burn>0){ if((!S.rl.flame||e.aura==='burn')&&!hold) s.burn-=dt; if(e.aura!=='burn') hit(e,e.bd*dt*(S.rl.flame?3:1),e.bs,false,true); if(e.dead)continue;
      if(s.burn<=0&&e.seed>0){ const n=e.seed-1; e.seed=0;   // 餘燼彈 Lv5 火種：自然熄滅就跳到別人身上
        const o=nearestN(e.x,e.y,4,150,e).find(o=>!(o.st.burn>0)&&o.aura!=='burn');
        if(o){ fxBolt(e.x,e.y,o.x,o.y,COL.burn,0.2); applyStatus(o,'burn',5,'ember',e.bd); if(!o.dead&&o.st.burn>0&&n>0) o.seed=n; } } }
    else if(e.seed) e.seed=0;
    if(!hold){ if(s.wet>0)s.wet-=dt; if(s.chill>0)s.chill-=dt; if(s.shock>0)s.shock-=dt; if(s.oil>0)s.oil-=dt; if(s.wood>0)s.wood-=dt; if(s.metal>0)s.metal-=dt; }
    if(s.vuln>0)s.vuln-=dt;
    if(s.frozen>0){ s.frozen-=dt; if(s.frozen<=0&&e.fb){ e.fb=0; frostBurst(e); if(e.dead)continue; } }
    // 天生狀態：被反應消耗後，過一段時間會重新出現（寒冷會拖慢火焰重燃）
    if(e.aura){ const k=e.aura;

function updGems(dt){

    if(!g.m&&q<pr) g.m=true;

function collect(g){

    p.sh=Math.min(shMax(),p.sh+8); sfx('shield'); txt(p.x,p.y-p.r-12,'+8 盾','#bfeaff',0.8);

function gainXp(v){

function updFX(dt){

/* ---------- 玩家 ---------- */
const input={active:false,id:null,ox:0,oy:0,cx:0,cy:0,keys:{}};
function updPlayer(dt){
  const p=S.p; let ix=0,iy=0;
  if(input.active){
    let dx=input.cx-input.ox, dy=input.cy-input.oy; const l=Math.hypot(dx,dy);
    if(l>70){ input.ox=input.cx-dx/l*70; input.oy=input.cy-dy/l*70; dx=input.cx-input.ox; dy=input.cy-input.oy; }
    const L=Math.hypot(dx,dy);
    if(L>6){ const k=Math.min(1,L/48); ix=dx/L*k; iy=dy/L*k; }
  }
  const K=input.keys, kx=(K.right?1:0)-(K.left?1:0), ky=(K.down?1:0)-(K.up?1:0);
  if(kx||ky){ const l=Math.hypot(kx,ky); ix=kx/l; iy=ky/l; }
  const m=Math.hypot(ix,iy); p.mv=m>0.05;
  const sp=p.spd*(1+0.1*pvl('spd'))*(p.slT>S.t?0.55:1);   // 被冰霜類招式打中會緩速
  if(p.mv){ p.x+=ix*sp*dt; p.y+=iy*sp*dt; p.fx=ix/m; p.fy=iy/m; p.moved=true; }
  if(p.kx||p.ky){ p.x+=p.kx*dt; p.y+=p.ky*dt; const k=Math.pow(0.02,dt); p.kx*=k; p.ky*=k; if(Math.abs(p.kx)+Math.abs(p.ky)<8) p.kx=p.ky=0; }
  if(p.inv>0)p.inv-=dt;
  const vl=pvl('vit'); if(vl&&p.hp<p.max) p.hp=Math.min(p.max,p.hp+[0,0.4,0.8,1.2][vl]*dt);
  if(p.shT>0) p.shT-=dt;
  else { const wl=pvl('ward'); if(wl&&p.sh<shMax()) p.sh=Math.min(shMax(),p.sh+[0,3,4,5][wl]*dt); }
}

function rxFor(id){
  const ap=SK[id].ap; if(!ap.length) return [];
  const all=ownedEls(ap), out=[];
  for(const k in REACT){

function resChain(k){
  const raw=RES[k].out, outs=raw.flatMap(o=>o==='ele'||o==='any'?EXP[o]:[o]), own=ownedEls(), res=[];
  const wild=raw.some(o=>o==='ele'||o==='any');

    if(!fed.length) continue;

function openLevelUp(){

function choose(i){
  const c=S.choices[i]; if(!c)return;
  const p=S.p;
  if(c.mu){
    S.mu[c.mu]=(S.mu[c.mu]||0)+1; S.muMode=0; p.hp=Math.min(p.max,p.hp+p.max*0.3);
    banner('詛咒：'+MU[c.mu].n,MU[c.mu].c);
    if(S.pend>0){ S.mode='levelup'; S.choices=genChoices(); showPick(); } else { S.mode='play'; p.inv=Math.max(p.inv,1); hideOv(); }
    updHUD(); return;
  }
  if(c.f){
    if(c.f==='heal') p.hp=Math.min(p.max,p.hp+p.max*0.4);
    else if(c.f==='guard') p.sh=shMax();
  } else if(c.r){ S.res[c.r]=1; sfx('res'); banner('共鳴：'+RES[c.r].n,REACT[c.r].c); }
  else if(c.rl){ S.rl[c.rl]=1; sfx('res'); banner('聖物：'+RL[c.rl].n,RL[c.rl].c); }
  else if(c.ct){ S.ct[c.ct]=(S.ct[c.ct]||0)+1; sfx('warn');
    if(c.ct==='blood'){ p.max=Math.max(30,Math.round(p.max*0.8)); p.hp=Math.min(p.hp,p.max); }
    if(c.ct==='trial') later(0.6,()=>spawnElites(1));
    banner('契約：'+CT[c.ct].n,CT[c.ct].c); }
  else if(c.asc){ S.asc++; sfx('res'); }
  else if(c.ms){ S.ms[c.ms]=(S.ms[c.ms]||0)+1; sfx('res'); }
  else if(c.tm){ const [a,b]=c.tm, i2=S.order.indexOf(a); if(i2>=0){ S.sk[b]={...S.sk[a],cd:0.4,pos:[]}; delete S.sk[a]; S.order[i2]=b; banner('重組：'+SK[a].ch+' → '+SK[b].ch,SK[b].c); sfx('res'); } }
  else if(c.fz){ doFuse(...c.fz); }
  else if(c.fz3){ doTri(...c.fz3); }
  else if(c.br){ const [bid,bk]=c.br, bs=S.sk[bid]; (bs.br||(bs.br={}))[bk]=(bs.br[bk]||0)+1; S.brFor=null; const b=BR[bid].find(x=>x.k===bk); banner(SK[bid].n+'・'+b.n+RN[bs.br[bk]],SK[bid].c); }
  else if(c.pv){
    if(S.pv[c.pv]) S.pv[c.pv]++; else { S.pv[c.pv]=1; S.porder.push(c.pv); }
    if(c.pv==='vit'){ p.max+=25; p.hp=Math.min(p.max,p.hp+25); }
    if(c.pv==='ward') p.sh=Math.min(shMax(),p.sh+15);
  }
  else if(S.sk[c.id]){ S.sk[c.id].lv++; if(BR[c.id]&&brChoices(c.id).length) S.brFor=c.id; }   // 升級後接著選特化分支
  else { S.sk[c.id]={lv:1,cd:0.4,ang:0,acc:0,pos:[]}; S.order.push(c.id); }
  renderSlots();
  if(S.brFor&&!c.br){ S.choices=brChoices(S.brFor); showPick(); updHUD(); return; }
  if(S.startPick){ if(c.id&&NODMG.has(c.id)&&S.order.length===1){ S.startMain=1; S.choices=starterChoices(true); showPick(); updHUD(); return; }   // 輔助起手：再選一個主力
    S.startPick=false; S.startMain=0; }
  else { S.pend--; if(S.pc>0) S.pc--; else if(S.lbx>0) S.lbx--; }
  if(S.pend>0){ S.mode='levelup'; S.choices=genChoices(); showPick(); }
  else { S.mode='play'; p.inv=Math.max(p.inv,0.6); hideOv(); }
  updHUD();
}

/* ===== 全球排行榜設定（Firebase Firestore）=====
   把 Firebase 專案的 projectId 和 apiKey 填在這裡就會啟用；留空則只有本機排行榜。
   apiKey 本來就是公開的，安全性由 Firestore 的安全規則負責。 */
const ONLINE={projectId:'resonance-3c16c',apiKey:'AIzaSyCfiDU3t24crHJ--IXsfQWrkG948I9QSYU'};
const onlineOn=()=>!!(ONLINE.projectId&&ONLINE.apiKey);
const fsBase=()=>`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(ONLINE.projectId)}/databases/(default)/documents`;
async function fsFetch(url,body){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'key='+encodeURIComponent(ONLINE.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok) throw new Error('http '+r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
async function fsSubmit(e){
  const I=v=>({integerValue:String(v|0)}), T=v=>({stringValue:String(v)});
  await fsFetch(fsBase()+'/scores',{fields:{name:T(e.name),sc:T(e.sc),t:I(e.t),k:I(e.k),lv:I(e.lv),b:I(e.b),sk:T(e.sk),d:I(e.d),v:I(1)}});
}
let gCache=null;
async function fsTop(){
  if(gCache&&performance.now()-gCache.at<30000) return gCache.list;
  const rows=await fsFetch(fsBase()+':runQuery',{structuredQuery:{from:[{collectionId:'scores'}],orderBy:[{field:{fieldPath:'t'},direction:'DESCENDING'}],limit:80}});
  const out=[], seen=new Set();
  for(const row of rows||[]){
    const f=row&&row.document&&row.document.fields; if(!f) continue;
    const str=k=>f[k]&&f[k].stringValue!=null?String(f[k].stringValue):'', num=k=>f[k]&&f[k].integerValue!=null?parseInt(f[k].integerValue,10)||0:0;
    const e={name:cleanName(str('name'))||'無名旅人',sc:SCHOOL[str('sc')]?str('sc'):'',t:num('t'),k:num('k'),lv:Math.max(1,num('lv')),b:num('b'),sk:str('sk').slice(0,12)};
    if(seen.has(e.name)) continue; seen.add(e.name); out.push(e);   // 每個暱稱只留最佳成績
  }
  out.sort((a,b)=>b.t-a.t||b.k-a.k);
  gCache={at:performance.now(),list:out.slice(0,50)};
  return gCache.list;
}
function loadGlobal(){
  const box=$('gList'); if(!box) return;
  fsTop().then(list=>{ const b=$('gList'); if(!b) return; const me=getName();
    b.innerHTML=list.length?list.map((e,i)=>lbRow({...e,own:!!me&&e.name===me},i)).join(''):'<p class="note">還沒有人上榜，當第一個吧。</p>'; })
  .catch(()=>{ const b=$('gList'); if(b) b.innerHTML='<p class="note">連不上全球排行榜（可能沒有網路）。可以先看本機排行榜。</p>'; });
}

const LB_KEY='resonance-lb', NAME_KEY='resonance-name', LB_SALT='共鳴/resonance/lb/v1';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName=x=>String(x||'').replace(/[\u0000-\u001f\u007f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,10);
function getName(){ try{ return cleanName(localStorage.getItem(NAME_KEY)); }catch(_){ return ''; } }
function setName(n){ try{ localStorage.setItem(NAME_KEY,cleanName(n)); }catch(_){} }
function hash32(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(36); }
function b64e(x){ const b=new TextEncoder().encode(x); let s=''; for(const c of b) s+=String.fromCharCode(c); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(x){ x=x.replace(/-/g,'+').replace(/_/g,'/'); while(x.length%4) x+='='; const s=atob(x), b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return new TextDecoder().decode(b); }
function encodeEntry(e){ const pl=b64e(JSON.stringify([1,e.name,e.sc,e.t,e.k,e.lv,e.b,e.sk,e.d])); return 'RES1.'+pl+'.'+hash32(LB_SALT+pl); }
const CODE_RE=/RES1\.[A-Za-z0-9_-]{8,400}\.[0-9a-z]{1,8}/g;
function decodeCode(code){
  const m=/^RES1\.([A-Za-z0-9_-]+)\.([0-9a-z]+)$/.exec(code); if(!m||hash32(LB_SALT+m[1])!==m[2]) return null;
  try{
    const a=JSON.parse(b64d(m[1])); if(!Array.isArray(a)||a[0]!==1) return null;
    const [,name,sc,t,k,lv,b,sk,d]=a, int=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
    if(typeof name!=='string'||typeof sk!=='string'||(sc!==''&&!SCHOOL[sc])) return null;
    if(!int(t,0,86400)||!int(k,0,1e7)||!int(lv,1,999)||!int(b,0,999)||!int(d,0,1e6)||sk.length>12) return null;
    return {name:cleanName(name)||'無名旅人',sc,t,k,lv,b,sk,d,code};
  }catch(_){ return null; }
}
function lbLoad(){ try{ const a=JSON.parse(localStorage.getItem(LB_KEY)||'[]'); return Array.isArray(a)?a.filter(x=>x&&x.code):[]; }catch(_){ return []; } }
function lbSave(a){ try{ localStorage.setItem(LB_KEY,JSON.stringify(a)); }catch(_){} }
function lbPut(ent,dropCode){
  const a=lbLoad().filter(x=>x.code!==ent.code&&x.code!==dropCode); a.push(ent);
  a.sort((x,y)=>y.t-x.t||y.k-x.k); const keep=a.slice(0,100); lbSave(keep);
  return keep.findIndex(x=>x.code===ent.code)+1;
}

function importCodes(){
  const box=$('imp'), msg=$('impMsg'); if(!box)return;
  const found=[...new Set(box.value.match(CODE_RE)||[])]; let ok=0, bad=0, dup=0; const have=new Set(lbLoad().map(x=>x.code));
  for(const c of found){ const e=decodeCode(c); if(!e){ bad++; continue; } if(have.has(c)){ dup++; continue; } lbPut(e); have.add(c); ok++; }
  boardTab='local'; showOv(boardHTML()); const m=$('impMsg');
  if(m) m.textContent=found.length?`加入 ${ok} 筆${dup?`，${dup} 筆已經在榜上`:''}${bad?`，${bad} 筆成績碼無效`:''}`:'沒有找到成績碼';
}

function endGame(win){

  const total=entries.reduce((a,[,v])=>a+v,0)||1;

    sub=rEntries.slice(0,2).map(([k])=>REACT[k].n).join('與')+'為主的打法';
  }
  const slain=!!S.bossDown, B=BOSS[S.boss&&S.boss.mid?S.boss.boss:S.bossK], met=!!S.boss;
  const best=loadBest(), score=(slain?2e6:win?1e6:0)+S.t;
  if(!S.endless&&(!best||score>(best.slain?2e6:best.win?1e6:0)+best.time)) saveBest({time:S.t,win,slain,school});
  const bars=entries.slice(0,7).map(([k,v])=>{

  if(S.endless) return endlessOver(entries,total,share,rEntries,school,sc,sub,bars);

    <div class="stats"><div><b>${S.p.lv}</b><small>等級</small></div><div><b>${S.kills}</b><small>擊殺</small></div><div><b>${nReact}</b><small>觸發反應</small></div></div>

function drawIdle(t){
  ctx.save();
  ctx.save(); ctx.translate(-((t*12)%256),-((t*7)%256)); drawBg(0,0,W+256,H+256); ctx.restore();
  const g=48, ox=(t*12)%g, oy=(t*7)%g;
  ctx.beginPath();
  for(let x=-ox;x<W;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=-oy;y<H;y+=g){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.strokeStyle='rgba(150,140,230,0.06)'; ctx.lineWidth=1; ctx.stroke();
  const cols=[COL.burn,COL.wet,COL.chill,COL.shock,COL.oil], pts=[];
  for(let i=0;i<5;i++){
    const a=t*0.25+i*TAU/5, rr=Math.min(W,H)*0.36*(0.85+0.15*Math.sin(t*0.9+i*1.7));
    pts.push([W/2+Math.cos(a)*rr, H*0.42+Math.sin(a)*rr*0.8]);
  }
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++)for(let j=i+1;j<5;j++){
    const pulse=0.5+0.5*Math.sin(t*1.3+i*2+j);
    ctx.strokeStyle=cols[i]; ctx.globalAlpha=0.05+0.1*pulse; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pts[i][0],pts[i][1]); ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke();
  }
  for(let i=0;i<5;i++){
    ctx.globalAlpha=0.16; ctx.fillStyle=cols[i]; circle(pts[i][0],pts[i][1],30); ctx.fill();
    ctx.globalAlpha=0.9; circle(pts[i][0],pts[i][1],5); ctx.fill();
  }
  ctx.restore();
}
function drawPick(g,t){
  const bob=Math.sin(t*4+g.x*0.05)*2, y=g.y+bob;
  if(g.k==='cry'){
    if(g.l<2&&Math.floor(g.l*8)%2===0) return;
    const c=COL[g.el];
    ctx.globalAlpha=0.25; ctx.fillStyle=c; circle(g.x,y,11); ctx.fill(); ctx.globalAlpha=1;
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*TAU/6+Math.PI/6, x=g.x+Math.cos(a)*6, yy=y+Math.sin(a)*6; i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); } ctx.closePath();
    ctx.fillStyle=c; ctx.fill(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.2; ctx.stroke();
    return;
  }
  const P={food:['補','#ff7d96'],mag:['吸','#46f0b4'],chest:['寶','#f2c46d'],lvbox:['升','#7cffb2']}[g.k], r=g.k==='chest'||g.k==='lvbox'?13:10;
  if(g.k==='chest'||g.k==='lvbox'){ ctx.globalAlpha=0.25+0.15*Math.sin(t*5); ctx.fillStyle=P[1]; circle(g.x,y,r+7); ctx.fill(); ctx.globalAlpha=1; }
  ctx.fillStyle='rgba(13,15,31,0.92)'; circle(g.x,y,r); ctx.fill();
  ctx.strokeStyle=P[1]; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=P[1]; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`900 ${Math.round(r*1.15)}px ${SERIF}`; ctx.fillText(P[0],g.x,y+1);
}
function edgeArrow(wx,wy,c){
  const p=S.p, x0=(wx-p.x)*ZOOM+W/2, y0=(wy-p.y)*ZOOM+H/2;
  if(x0>-8&&x0<W+8&&y0>-8&&y0<H+8) return;
  const a=Math.atan2(y0-H/2,x0-W/2), ca=Math.cos(a), sa=Math.sin(a), m=22;
  const k=Math.min((W/2-m)/Math.max(1e-6,Math.abs(ca)),(H/2-m)/Math.max(1e-6,Math.abs(sa)));
  ctx.save(); ctx.translate(W/2+ca*k,H/2+sa*k); ctx.rotate(a); ctx.globalAlpha=0.85; ctx.fillStyle=c;
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,7); ctx.lineTo(-6,-7); ctx.closePath(); ctx.fill(); ctx.restore();
}

      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.arc(f.x,f.y,f.len,f.a-f.ang/2,f.a+f.ang/2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=hexA(c,0.95*k); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x,f.y,f.len*(1.05-0.25*k),f.a-f.ang/2,f.a+f.ang/2); ctx.stroke();
      ctx.lineWidth=1.5; for(let i=0;i<5;i++){ const b=f.a+(i/4-0.5)*f.ang*0.9, r1=f.len*0.35, r2=f.len*(0.95-0.2*k); ctx.strokeStyle=hexA(c,0.55*k); ctx.beginPath(); ctx.moveTo(f.x+Math.cos(b)*r1,f.y+Math.sin(b)*r1); ctx.lineTo(f.x+Math.cos(b)*r2,f.y+Math.sin(b)*r2); ctx.stroke(); } }
  }
  for(const h of S.H){ if(h.k!=='shot'||!vis(h.x,h.y,12))continue; ctx.fillStyle=`rgba(${h.c},0.35)`; circle(h.x,h.y,h.r+5); ctx.fill(); ctx.fillStyle=`rgb(${h.c})`; circle(h.x,h.y,h.r); ctx.fill(); ctx.fillStyle='#ffffff'; circle(h.x,h.y,h.r*0.45); ctx.fill(); }
  for(const f of S.FX){
    const k=Math.max(0,f.l/f.m);
    if(f.k==='ln'||f.k==='cone') continue;
    if(f.k==='pt'){ const v=Math.abs(f.vx)+Math.abs(f.vy); ctx.globalAlpha=k;
      if(v>60){ ctx.strokeStyle=f.c; ctx.lineWidth=f.s*0.85; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x-f.vx*0.05,f.y-f.vy*0.05); ctx.stroke(); ctx.lineCap='butt'; }
      else { ctx.fillStyle=f.c; circle(f.x,f.y,f.s*0.6); ctx.fill(); } }
    else if(f.k==='vine'){ const P=f.pts, n=P.length/2, el=(f.m-f.l), grow=Math.min(1,el/(f.dur||0.2)), m=Math.max(2,Math.ceil(n*grow)), fade=Math.min(1,f.l/0.15);   // 藤鞭：藤從手邊一路甩出去
      ctx.lineCap='round'; ctx.lineJoin='round'; for(const [w,c] of [[9,'rgba(46,110,40,'],[5,'rgba(126,217,87,'],[1.6,'rgba(220,255,190,']]){ ctx.strokeStyle=c+(0.9*fade)+')'; ctx.lineWidth=w; ctx.beginPath(); for(let i=0;i<m;i++){ const x=P[i*2], y=P[i*2+1]; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); }
      ctx.fillStyle=`rgba(150,230,100,${fade})`; for(let i=1;i<m;i+=2){ const x=P[i*2], y=P[i*2+1], b=Math.atan2(P[i*2+1]-P[i*2-1],P[i*2]-P[i*2-2])+(i%4?1.2:-1.2); ctx.beginPath(); ctx.ellipse(x+Math.cos(b)*6,y+Math.sin(b)*6,5,2.4,b,0,TAU); ctx.fill(); }
      ctx.lineCap='butt'; ctx.lineJoin='miter'; }
    else if(f.k==='boom'){ const r=f.r*(0.45+0.55*(1-k*k)); ctx.globalAlpha=1; bloom(f.x,f.y,f.r*1.3,f.c,0.55*k*k);
      ctx.globalAlpha=0.18*k; ctx.fillStyle=f.c; circle(f.x,f.y,r); ctx.fill(); ctx.globalAlpha=0.9*k; ctx.strokeStyle=f.c; ctx.lineWidth=1+3.5*k; ctx.stroke();
      if(k>0.6&&f.r>=40){ ctx.globalAlpha=(k-0.6)*2; ctx.fillStyle='#ffffff'; circle(f.x,f.y,r*0.18); ctx.fill(); } }
    else if(f.k==='ring'){ const r=f.r*(0.3+0.7*(1-k)); ctx.globalAlpha=0.3*k; ctx.strokeStyle=f.c; ctx.lineWidth=10; circle(f.x,f.y,r); ctx.stroke(); ctx.globalAlpha=k; ctx.lineWidth=2.2; ctx.stroke(); }
    else if(f.k==='bolt'){ ctx.globalAlpha=k; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(f.pts[0],f.pts[1]); for(let i=2;i<f.pts.length;i+=2)ctx.lineTo(f.pts[i],f.pts[i+1]);
      ctx.strokeStyle=hexA(hx6(f.c),0.2); ctx.lineWidth=6; ctx.stroke(); ctx.strokeStyle=f.c; ctx.lineWidth=2.2; ctx.stroke(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=0.9; ctx.stroke(); ctx.lineJoin='miter';
      const n=f.pts.length; ctx.globalAlpha=1; bloom(f.pts[n-2],f.pts[n-1],11,f.c,0.8*k); }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  // 反應文字
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  for(const tx of S.TX){
    const k=tx.l/tx.m; ctx.globalAlpha=Math.min(1,k*3);
    ctx.font=`900 ${Math.round(15*tx.sc)}px ${SERIF}`;
    ctx.lineWidth=3.5; ctx.strokeStyle='rgba(8,8,20,0.85)'; ctx.strokeText(tx.s,tx.x,tx.y);
    ctx.fillStyle=tx.c; ctx.fillText(tx.s,tx.x,tx.y);
  }
  ctx.globalAlpha=1;

  // 螢幕空間
  ctx.setTransform(DPR,0,0,DPR,0,0);
  { const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.38,W/2,H/2,Math.max(W,H)*0.78); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,6,0.5)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H); }
  if(S.mu.fog){ const fg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.26,W/2,H/2,Math.max(W,H)*0.62);
    fg.addColorStop(0,'rgba(6,4,14,0)'); fg.addColorStop(1,'rgba(6,4,14,0.93)'); ctx.fillStyle=fg; ctx.fillRect(0,0,W,H); }
  if(S.wx){ const k=Math.max(0,Math.min(1,S.wxT/1.5,(22-S.wxT)/1.5));
    if(S.wx==='rain'){ ctx.strokeStyle=`rgba(120,180,255,${0.35*k})`; ctx.lineWidth=1; ctx.beginPath();
      for(let i=0;i<70;i++){ const x=((i*137.5+now*90)%(W+60))-30, y=((i*89.3+now*620)%(H+80))-40; ctx.moveTo(x,y); ctx.lineTo(x-6,y+16); } ctx.stroke(); }
    else if(S.wx==='snow'){ ctx.fillStyle=`rgba(230,245,255,${0.6*k})`;
      for(let i=0;i<60;i++){ const x=((i*97.1+Math.sin(now+i)*20+now*25)%(W+20))-10, y=((i*61.7+now*55)%(H+20))-10; ctx.fillRect(x,y,2,2); } }
    else if(S.wx==='heat'){ ctx.fillStyle=`rgba(255,110,40,${0.08*k})`; ctx.fillRect(0,0,W,H); }
    else if(S.wx==='storm'){ ctx.fillStyle=`rgba(10,10,30,${0.22*k})`; ctx.fillRect(0,0,W,H); }
    else if(S.wx==='smog'){ ctx.fillStyle=`rgba(70,48,20,${0.14*k})`; ctx.fillRect(0,0,W,H); ctx.fillStyle=`rgba(40,26,10,${0.55*k})`;
      for(let i=0;i<45;i++){ const x=((i*113.3+Math.sin(now*0.7+i)*14)%(W+20))-10, y=((i*71.9+now*70)%(H+20))-10; ctx.fillRect(x,y,2.5,3.5); } }
    else if(S.wx==='gale'){ ctx.strokeStyle=`rgba(150,255,235,${0.28*k})`; ctx.lineWidth=1.2; ctx.beginPath();
      for(let i=0;i<34;i++){ const y=(i*53.7)%H, x=((i*211.3+now*900)%(W+260))-130; ctx.moveTo(x,y); ctx.lineTo(x+60+(i%3)*25,y-6); } ctx.stroke(); }
    else if(S.wx==='eclipse'){ ctx.fillStyle=`rgba(16,8,34,${0.3*k})`; ctx.fillRect(0,0,W,H);
      if(S.ecT!=null){ const q=Math.max(0,S.ecT/4), sx=W/2, sy=H/2; ctx.strokeStyle=`rgba(181,140,255,${(0.25+0.5*(1-q))*k})`; ctx.lineWidth=2; ctx.setLineDash([6,8]);
        ctx.beginPath(); ctx.arc(sx,sy,30+q*Math.min(W,H)*0.42,0,TAU); ctx.stroke(); ctx.setLineDash([]); } }
  }
  if(S.flash>0){ ctx.fillStyle=`rgba(255,248,225,${Math.min(0.45,S.flash)})`; ctx.fillRect(0,0,W,H); }
  const low=p.hp/p.max<0.3?0.18+0.1*Math.sin(now*6):0, hv=Math.max(low,S.hurt>0?S.hurt*0.9:0);
  if(hv>0){
    const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.72);
    gr.addColorStop(0,'rgba(255,40,80,0)'); gr.addColorStop(1,`rgba(255,40,80,${Math.min(0.5,hv)})`);
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  }
  for(const e of S.E) if(e.elite) edgeArrow(e.x,e.y,e.boss?e.c:'#ff2d55');
  for(const g of S.G) if(g.k==='chest') edgeArrow(g.x,g.y,'#f2c46d'); else if(g.k==='lvbox') edgeArrow(g.x,g.y,'#7cffb2');
  if(input.active&&S.mode==='play'){
    const dx=input.cx-input.ox, dy=input.cy-input.oy, l=Math.hypot(dx,dy), m=Math.min(l,48), kx=l?dx/l*m:0, ky=l?dy/l*m:0;
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=2; circle(input.ox,input.oy,48); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.18)'; circle(input.ox+kx,input.oy+ky,20); ctx.fill();
  }
  if(S.mode==='play'&&!p.moved&&t<10){
    ctx.globalAlpha=0.6+0.3*Math.sin(now*4);
    ctx.fillStyle='#ece8f5'; ctx.textAlign='center'; ctx.font=`700 15px ${SERIF}`;
    ctx.fillText('按住螢幕任意處，拖曳來移動',W/2,H*0.7);
    ctx.globalAlpha=1;
  }
}

/* ---------- 迴圈 ---------- */
let last=performance.now();
function frame(nowMs){
  let dt=(nowMs-last)/1000; last=nowMs;
  if(!(dt>0))dt=0; if(dt>0.05)dt=0.05;
  if(S&&S.mode==='play') update(dt);
  const mode=S?S.mode:'title';
  if(!S||mode==='play'||mode!==lastMode) render(nowMs/1000);
  lastMode=mode;
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);

})();
</script>
</body>
